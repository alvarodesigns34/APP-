name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      # `build:pages` y no `build`: es la variante que se despliega de verdad
      # (base /APP-/ más el 404.html del fallback de SPA). Probando solo `build`
      # con base "/", una regresión en el prefijo o en scripts/spa-404.mjs
      # pasaba CI en verde y solo se descubría con el deploy ya publicado —
      # dejando, por ejemplo, un dist sin 404.html, con lo que refrescar en
      # /APP-/comida devuelve el 404 genérico de GitHub.
      - run: npm run build:pages
