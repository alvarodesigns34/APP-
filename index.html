<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="Brío: nutrición, actividad, agua, sueño y peso. En tu dispositivo." />
    <title>Brío — Salud y fitness</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/outfit-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-opsz-wght.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* Theme and accent live inside the app's own state blob, but the React
         tree that applies them only mounts after hydration — so someone on the
         dark theme got a full cream-coloured flash on every cold start, and the
         accent landed a frame later on top of that. Resolve both here, before
         first paint. Deliberately defensive: anything unexpected just leaves
         the stylesheet defaults in place.
         The key is STORE_KEY from src/lib/brio/types.ts; accent.test.ts asserts
         the two stay in step, because a silent mismatch would only show up as
         the flash quietly coming back. */
      (function () {
        try {
          var raw = localStorage.getItem("brio.v4");
          var s = (raw ? JSON.parse(raw) || {} : {}).settings || {};
          var pref = s.theme === "light" || s.theme === "dark" ? s.theme : "auto";
          var dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.dataset.accent = typeof s.accent === "string" ? s.accent : "verde";
          // The meta tag paints the browser chrome (iOS status bar, Android
          // address bar) — this script sets the `dark` class above so the page
          // itself never flashes light, but the tag was still hardcoded to
          // green, so the chrome flashed green (or light green, on the dark
          // theme) on every cold start regardless. `applyTheme` in app-shell.tsx
          // corrects it after hydration by reading `--brio-bg`, but that CSS
          // custom property does not exist yet at this point — the stylesheet
          // loads via the JS module, not a <link> in <head> — so the two colours
          // are hardcoded here too. `--brio-bg` does not vary per accent, only
          // `--brio-primary` does, so this needs no `accent` branch. Keep in
          // sync with `:root`/`.dark` in src/styles.css.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#141612" : "#f4f1ea");
        } catch (e) {
          /* private mode, blocked storage, corrupt JSON — defaults are fine */
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
