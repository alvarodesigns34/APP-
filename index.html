  /* Hoja de cantidad con recálculo en vivo. */
  quantity: function (food, key, mealId, entry) {
    const units = [{ name: food.base === 'ml' ? 'mililitros' : 'gramos', g: 1, raw: true }].concat(food.units);
    let unitIdx = 0;
    if (entry) {
      const found = units.findIndex(function (u) { return u.name === entry.unitName; });
      unitIdx = found >= 0 ? found : 0;
    } else if (food.units.length) {
      unitIdx = 1;
    }
    let qty = entry ? entry.qty : (unitIdx === 0 ? 100 : 1);
    let meal = entry ? entry.mealId : mealId;


    const body =
      '<div class="block" style="padding-top:0">' +
        '<div class="card" style="text-align:center">' +
          '<div class="card-title" style="justify-content:center">' + esc(food.name) + '</div>' +
          '<div class="kcal-hero" style="padding-bottom:8px"><div class="kh-num" id="qKcal">0</div><div class="kh-lab">kcal</div></div>' +
          '<div class="nutri-grid" id="qMacros"></div>' +
        '</div>' +
        '<span class="label" style="margin-top:16px">Cantidad</span>' +
        '<div class="stepper">' +
          '<button type="button" class="sbtn" data-qd="-1" aria-label="Reducir cantidad">' + icon('minus', 20, { w: 2.4 }) + '</button>' +
          '<input class="field sval" id="qVal" type="number" inputmode="decimal" min="0.1" step="any" value="' + qty +
          '" aria-label="Cantidad" style="text-align:center;background:none">' +
          '<button type="button" class="sbtn" data-qd="1" aria-label="Aumentar cantidad">' + icon('plus', 20, { w: 2.4 }) + '</button>' +
        '</div>' +
        '<span class="label" style="margin-top:16px">Unidad</span>' +
        '<div class="segmented wrap" role="radiogroup" aria-label="Unidad de medida">' +
          units.map(function (u, i) {
            return '<button type="button" role="radio" data-qu="' + i + '" aria-checked="' + (i === unitIdx ? 'true' : 'false') + '">' +
              esc(u.raw ? (food.base === 'ml' ? 'ml' : 'g') : u.name) + '</button>';
          }).join('') +
        '</div>' +
        '<span class="label" style="margin-top:16px">Ingesta</span>' +
        segmented(MEALS, meal, 'data-qm', 'Ingesta') +
        '<p class="hint" id="qGrams" style="margin-top:12px"></p>' +
        '<p class="field-error" id="qErr" hidden></p>' +
      '</div>';


    const h = Sheet.open({
      title: entry ? 'Editar registro' : 'Añadir alimento',
      right: entry ? 'Guardar' : 'Añadir', body: body,
      onMount: function (hh) { refresh(hh); },
      onConfirm: function (hh) {
        const v = parseNum($('#qVal', hh.el).value);
        const err = $('#qErr', hh.el);
        if (isNaN(v) || v <= 0) {
          err.hidden = false; err.textContent = 'Introduce una cantidad mayor que cero.';
          return;
        }
        const u = units[unitIdx];
        const grams = v * u.g;
        if (grams > 5000) {
          err.hidden = false; err.textContent = 'La cantidad resultante supera los 5 kg. Revisa el valor.';
          return;
        }
        const n = nutrientsFor(food, grams);
        const rec = {
          id: entry ? entry.id : uid('e'),
          foodId: food.id, name: food.name,
          qty: round(v, 2), unitName: u.name, grams: round(grams, 1),
          kcal: round(n.kcal, 1), prot: round(n.prot, 1), carb: round(n.carb, 1), fat: round(n.fat, 1),
          fib: round(n.fib, 1),
          sug: n.sug == null ? null : round(n.sug, 1),
          sat: n.sat == null ? null : round(n.sat, 1),
          sod: n.sod == null ? null : round(n.sod, 1)
        };
        State.update(function (s) {
          const d = State.ensureDay(key);
          if (entry) {
            const from = d.meals[entry.mealId] || [];
            const i = from.findIndex(function (x) { return x.id === entry.id; });
            if (i >= 0) from.splice(i, 1);
          }
          d.meals[meal].push(rec);
          const ri = s.recents.indexOf(food.id);
          if (ri >= 0) s.recents.splice(ri, 1);
          s.recents.unshift(food.id);
          if (s.recents.length > 25) s.recents.length = 25;
        }, ['meal', 'day']);
        hh.close(true);
        Toast.show(entry ? 'Registro actualizado' : 'Añadido a ' + mealOf(meal).n.toLowerCase(), 'check');
      }
    });


    function refresh(hh) {
      if (hh.closed) return;
      const v = Math.max(0, parseNum($('#qVal', hh.el).value) || 0);
      const grams = v * units[unitIdx].g;
      const n = nutrientsFor(food, grams);
      $('#qKcal', hh.el).textContent = nf(n.kcal);
      $('#qMacros', hh.el).innerHTML =
        '<div><b>' + nf(n.prot, 1) + '</b><span>Proteínas</span></div>' +
        '<div><b>' + nf(n.carb, 1) + '</b><span>Hidratos</span></div>' +
        '<div><b>' + nf(n.fat, 1) + '</b><span>Grasas</span></div>' +
        '<div><b>' + nf(n.fib, 1) + '</b><span>Fibra</span></div>';
      $('#qGrams', hh.el).textContent = 'Equivale a ' + nf(grams, 1) + ' ' + food.base +
        ' · ' + nf(food.kcal) + ' kcal por 100 ' + food.base + '.';
    }


    h.el.addEventListener('click', function (e) {
      const d = e.target.closest('[data-qd]');
      if (d) {
        const inp = $('#qVal', h.el);
        const stepv = units[unitIdx].raw ? 10 : 0.5;
        inp.value = round(Math.max(stepv, (parseNum(inp.value) || 0) + Number(d.getAttribute('data-qd')) * stepv), 2);
        pulse(d); refresh(h); return;
      }
      const u = e.target.closest('[data-qu]');
      if (u) {
        const prev = units[unitIdx];
        unitIdx = Number(u.getAttribute('data-qu'));
        selectOne($$('[data-qu]', h.el), u);
        const inp = $('#qVal', h.el);
        const grams = (parseNum(inp.value) || 0) * prev.g;
        inp.value = round(Math.max(0.1, grams / units[unitIdx].g), 2);
        refresh(h); return;
      }
      const m = e.target.closest('[data-qm]');
      if (m) { meal = m.getAttribute('data-qm'); selectOne($$('[data-qm]', h.el), m); }
    });
    h.el.addEventListener('input', function (e) { if (e.target.id === 'qVal') refresh(h); });
  },


  /* Alimento personalizado */
  customFood: function (existing, done) {
    const f = existing || { name: '', kcal: '', prot: '', carb: '', fat: '', fib: '', base: 'g', units: [] };
    const unit = f.units && f.units.length ? f.units[0] : null;
    const nums = [
      ['Kcal', 'cfKcal', 'Kilocalorías', 0, 900],
      ['Prot', 'cfProt', 'Proteínas (g)', 0, 100],
      ['Carb', 'cfCarb', 'Hidratos (g)', 0, 100],
      ['Fat', 'cfFat', 'Grasas (g)', 0, 100],
      ['Fib', 'cfFib', 'Fibra (g, opcional)', 0, 80]
    ];
    const vals = { cfKcal: f.kcal, cfProt: f.prot, cfCarb: f.carb, cfFat: f.fat, cfFib: f.fib };
    const body =
      '<div class="block" style="padding-top:0">' +
        '<label class="label" for="cfName">Nombre</label>' +
        '<input class="field" id="cfName" type="text" maxlength="60" value="' + esc(f.name) + '" placeholder="Yogur de la marca X">' +
        '<span class="label" style="margin-top:16px">Medida base</span>' +
        segmented([{ id: 'g', n: 'Por 100 g' }, { id: 'ml', n: 'Por 100 ml' }], f.base, 'data-cfbase', 'Medida base') +
        '<div class="grid-2" style="margin-top:16px">' +
          nums.map(function (x) {
            return '<div><label class="label" for="' + x[1] + '">' + x[2] + '</label>' +
              '<input class="field" id="' + x[1] + '" type="number" inputmode="decimal" min="' + x[3] + '" max="' + x[4] +
              '" step="0.1" value="' + esc(vals[x[1]]) + '"></div>';
          }).join('') +
          '<div><label class="label" for="cfUnit">Peso por unidad (g)</label>' +
          '<input class="field" id="cfUnit" type="number" inputmode="decimal" min="0" max="2000" step="1" value="' +
          esc(unit ? unit.g : '') + '" placeholder="Opcional"></div>' +
        '</div>' +
        '<p class="hint" style="margin-top:12px">Si el alimento se consume por unidades (un yogur, una barrita), indica su peso medio real: podrás registrarlo por unidad.</p>' +
        '<p class="field-error" id="cfErr" hidden></p>' +
        (existing ? '<button type="button" class="btn danger full" style="margin-top:20px" data-cfdel>Eliminar alimento</button>' : '') +
      '</div>';


    const h = Sheet.open({
      title: existing ? 'Editar alimento' : 'Nuevo alimento',
      right: 'Guardar', body: body,
      onConfirm: function (hh) {
        const err = $('#cfErr', hh.el);
        const name = $('#cfName', hh.el).value.trim();
        if (name.length < 2) { err.hidden = false; err.textContent = 'El nombre necesita al menos 2 caracteres.'; return; }
        const base = $('[data-cfbase][aria-checked="true"]', hh.el).getAttribute('data-cfbase');
        const out = {};
        // La fibra es de declaración voluntaria en el etiquetado: se admite en
        // blanco y se toma como cero. El resto son obligatorios.
        for (let i = 0; i < nums.length; i++) {
          const x = nums[i];
          const input = $('#' + x[1], hh.el);
          const raw = input.value.trim();
          if (!raw) {
            if (x[1] === 'cfFib') { out[x[1]] = 0; continue; }
            input.classList.add('invalid');
            err.hidden = false;
            err.textContent = 'Falta el valor de ' + x[2].split(' (')[0].toLowerCase() + ' por 100 ' + base + '.';
            return;
          }
          const v = parseNum(raw);
          if (isNaN(v) || v < x[3] || v > x[4]) {
            input.classList.add('invalid');
            err.hidden = false;
            err.textContent = x[2].split(' (')[0] + ': introduce un número entre ' + nf(x[3]) + ' y ' + nf(x[4]) + '.';
            return;
          }
          input.classList.remove('invalid');
          out[x[1]] = round(v, 2);
        }
        if (out.cfProt + out.cfCarb + out.cfFat > 100) {
          err.hidden = false;
          err.textContent = 'Proteínas, hidratos y grasas suman ' + nf(out.cfProt + out.cfCarb + out.cfFat, 1) +
            ' g por cada 100. Revisa los valores de la etiqueta.';
          return;
        }
        const uw = parseNum($('#cfUnit', hh.el).value);
        const rec = {
          id: existing ? existing.id : uid('c'),
          name: name, cat: 'propio',
          kcal: out.cfKcal, prot: out.cfProt, carb: out.cfCarb, fat: out.cfFat, fib: out.cfFib,
          sug: null, sat: null, sod: null,
          base: base,
          units: (!isNaN(uw) && uw > 0) ? [{ name: 'unidad', g: round(uw, 1) }] : []
        };
        State.update(function (s) {
          const i = existing ? s.customFoods.findIndex(function (x) { return x.id === existing.id; }) : -1;
          if (i >= 0) s.customFoods[i] = rec; else s.customFoods.push(rec);
        }, ['food']);
        FoodIndex.rebuild();
        hh.close(true);
        Toast.show('Alimento guardado', 'check');
        if (done) done();
      }
    });


    h.el.addEventListener('click', function (e) {
      const b = e.target.closest('[data-cfbase]');
      if (b) { selectOne($$('[data-cfbase]', h.el), b); return; }
      if (e.target.closest('[data-cfdel]')) {
        const copyFood = JSON.parse(JSON.stringify(existing));
        Dialog.confirm('Eliminar alimento', 'Se eliminará "' + existing.name + '" de tus alimentos. Los registros ya guardados no cambian.', 'Eliminar', true)
          .then(function (ok) {
            if (!ok) return;
            State.update(function (s) {
              s.customFoods = s.customFoods.filter(function (x) { return x.id !== existing.id; });
              s.favorites = s.favorites.filter(function (x) { return x !== existing.id; });
              s.recents = s.recents.filter(function (x) { return x !== existing.id; });
            }, ['food']);
            FoodIndex.rebuild();
            h.close(true);
            Toast.undo('"' + copyFood.name + '" eliminado', function () {
              State.update(function (s) { s.customFoods.push(copyFood); }, ['food']);
              FoodIndex.rebuild();
              Toast.show('Alimento restaurado', 'check');
            });
            if (done) done();
          });
      }
    });
  },


  /* Receta / plato compuesto */
  recipe: function (existing, done) {
    const items = existing ? existing.items.slice() : [];


    const body =
      '<div class="block" style="padding-top:0">' +
        '<label class="label" for="rcName">Nombre del plato</label>' +
        '<input class="field" id="rcName" type="text" maxlength="60" value="' + esc(existing ? existing.name : '') + '" placeholder="Lentejas de casa">' +
        '<label class="label" style="margin-top:16px" for="rcServ">Raciones que salen</label>' +
        '<div class="stepper">' +
          '<button type="button" class="sbtn" data-rcs="-1" aria-label="Menos raciones">' + icon('minus', 20, { w: 2.4 }) + '</button>' +
          '<input class="field sval" id="rcServ" type="number" inputmode="numeric" min="1" max="30" step="1" value="' +
          (existing ? existing.servings : 4) + '" aria-label="Raciones" style="text-align:center;background:none">' +
          '<button type="button" class="sbtn" data-rcs="1" aria-label="Más raciones">' + icon('plus', 20, { w: 2.4 }) + '</button>' +
        '</div>' +
        '<div class="section-header" style="padding-left:0;padding-right:0">Ingredientes</div>' +
        '<div id="rcItems"></div>' +
        '<button type="button" class="btn tinted full" style="margin-top:12px" data-rcadd>Añadir ingrediente</button>' +
        '<div class="card" style="margin-top:16px"><div class="card-head"><span class="card-title">Por ración</span></div>' +
          '<div class="nutri-grid" id="rcTotals"></div></div>' +
        '<p class="field-error" id="rcErr" hidden></p>' +
        (existing ? '<button type="button" class="btn danger full" style="margin-top:20px" data-rcdel>Eliminar receta</button>' : '') +
      '</div>';


    const h = Sheet.open({
      title: existing ? 'Editar receta' : 'Nueva receta',
      right: 'Guardar', body: body,
      onMount: function (hh) { renderItems(hh); },
      onConfirm: function (hh) {
        const err = $('#rcErr', hh.el);
        const name = $('#rcName', hh.el).value.trim();
        if (name.length < 2) { err.hidden = false; err.textContent = 'Ponle un nombre de al menos 2 caracteres.'; return; }
        if (!items.length) { err.hidden = false; err.textContent = 'Añade al menos un ingrediente.'; return; }
        const servings = clamp(Math.round(parseNum($('#rcServ', hh.el).value) || 1), 1, 30);
        const tot = totals();
        const totalG = sum(items, function (i) { return i.grams; });
        if (!totalG) { err.hidden = false; err.textContent = 'Los ingredientes suman cero gramos. Revisa las cantidades.'; return; }
        const rec = {
          id: existing ? existing.id : uid('r'),
          name: name, items: items, servings: servings,
          servingG: round(totalG / servings, 1),
          per100: {
            kcal: round(tot.kcal / totalG * 100, 1),
            prot: round(tot.prot / totalG * 100, 1),
            carb: round(tot.carb / totalG * 100, 1),
            fat: round(tot.fat / totalG * 100, 1),
            fib: round(tot.fib / totalG * 100, 1)
          }
        };
        State.update(function (st) {
          const i = existing ? st.recipes.findIndex(function (x) { return x.id === existing.id; }) : -1;
          if (i >= 0) st.recipes[i] = rec; else st.recipes.push(rec);
        }, ['food']);
        FoodIndex.rebuild();
        hh.close(true);
        Toast.show('Receta guardada', 'check');
        if (done) done();
      }
    });


    function totals() {
      const t = { kcal: 0, prot: 0, carb: 0, fat: 0, fib: 0 };
      items.forEach(function (it) {
        const f = FoodIndex.get(it.foodId);
        if (!f) return;
        const n = nutrientsFor(f, it.grams);
        t.kcal += n.kcal; t.prot += n.prot; t.carb += n.carb; t.fat += n.fat; t.fib += n.fib;
      });
      return t;
    }


    function renderItems(hh) {
      if (hh.closed) return;
      const box = $('#rcItems', hh.el);
      if (!items.length) {
        box.innerHTML = '<p class="hint">Aún no hay ingredientes. Añádelos y la app calculará los valores por ración.</p>';
      } else {
        box.innerHTML = '<div class="list">' + items.map(function (it, i) {
          const f = FoodIndex.get(it.foodId);
          const n = f ? nutrientsFor(f, it.grams) : { kcal: 0 };
          return '<div class="row"><span class="row-main"><span class="row-title">' + esc(f ? f.name : 'Alimento eliminado') + '</span>' +
            '<span class="row-sub">' + nf(it.grams, 1) + ' g · ' + nf(n.kcal) + ' kcal</span></span>' +
            '<button type="button" class="row-chev" data-rcdelitem="' + i + '" aria-label="Quitar ingrediente" style="color:var(--red-txt)">' +
            icon('trash', 18, { w: 1.9 }) + '</button></div>';
        }).join('') + '</div>';
      }
      const servings = clamp(Math.round(parseNum($('#rcServ', hh.el).value) || 1), 1, 30);
      const t = totals();
      $('#rcTotals', hh.el).innerHTML =
        '<div><b>' + nf(t.kcal / servings) + '</b><span>kcal</span></div>' +
        '<div><b>' + nf(t.prot / servings, 1) + '</b><span>Proteínas</span></div>' +
        '<div><b>' + nf(t.carb / servings, 1) + '</b><span>Hidratos</span></div>' +
        '<div><b>' + nf(t.fat / servings, 1) + '</b><span>Grasas</span></div>';
    }


    h.el.addEventListener('click', function (e) {
      const st = e.target.closest('[data-rcs]');
      if (st) {
        const inp = $('#rcServ', h.el);
        inp.value = clamp((parseNum(inp.value) || 1) + Number(st.getAttribute('data-rcs')), 1, 30);
        pulse(st); renderItems(h); return;
      }
      const del = e.target.closest('[data-rcdelitem]');
      if (del) { items.splice(Number(del.getAttribute('data-rcdelitem')), 1); renderItems(h); return; }
      if (e.target.closest('[data-rcadd]')) {
        FoodFlow.pickIngredient(function (it) { items.push(it); renderItems(h); });
        return;
      }
      if (e.target.closest('[data-rcdel]')) {
        const copyRec = JSON.parse(JSON.stringify(existing));
        Dialog.confirm('Eliminar receta', 'Se eliminará "' + existing.name + '" de tus recetas.', 'Eliminar', true).then(function (ok) {
          if (!ok) return;
          State.update(function (s) { s.recipes = s.recipes.filter(function (x) { return x.id !== existing.id; }); }, ['food']);
          FoodIndex.rebuild();
          h.close(true);
          Toast.undo('"' + copyRec.name + '" eliminada', function () {
            State.update(function (s) { s.recipes.push(copyRec); }, ['food']);
            FoodIndex.rebuild();
            if (done) done();
            Toast.show('Receta restaurada', 'check');
          });
          if (done) done();
        });
      }
    });
    h.el.addEventListener('input', function (e) { if (e.target.id === 'rcServ') renderItems(h); });
  },


  /* Selector reducido para ingredientes de receta */
  pickIngredient: function (cb) {
    let q = '';
    const body =
      '<div class="searchbar"><div class="sb-inner">' + icon('search', 17, { w: 2.2 }) +
      '<input id="piSearch" type="search" placeholder="Buscar ingrediente" autocomplete="off" aria-label="Buscar ingrediente"></div></div>' +
      '<div id="piResults" style="padding:0 16px"></div>';
    const h = Sheet.open({ title: 'Añadir ingrediente', left: 'Cancelar', body: body });


    function render() {
      const list = FoodIndex.search(q, 'all', 40).filter(function (f) { return !f.recipe; });
      const box = $('#piResults', h.el);
      if (!box) return;
      if (!list.length) { box.innerHTML = emptyState('search', 'Sin resultados', 'Prueba con otro término.'); return; }
      box.innerHTML = '<div class="list">' + list.map(function (f) {
        return '<button type="button" class="row" data-pipick="' + esc(f.id) + '">' +
          '<span class="row-main"><span class="row-title">' + esc(f.name) + '</span>' +
          '<span class="row-sub">' + nf(f.kcal) + ' kcal / 100 ' + f.base + '</span></span>' +
          '<span class="row-chev">' + icon('chevR', 16, { w: 2.4 }) + '</span></button>';
      }).join('') + '</div>';
    }
    render();
    $('#piSearch', h.el).addEventListener('input', function (e) { q = e.target.value; render(); });
    h.el.addEventListener('click', function (e) {
      const b = e.target.closest('[data-pipick]');
      if (!b) return;
      const f = FoodIndex.get(b.getAttribute('data-pipick'));
      if (!f) return;
      Sheet.open({
        title: 'Cantidad', right: 'Añadir', focus: true,
        body: '<div class="block" style="padding-top:0">' +
          '<label class="label" for="piG">Cantidad de ' + esc(f.name) + ' (' + f.base + ')</label>' +
          '<input class="field" id="piG" type="number" inputmode="decimal" min="1" max="5000" step="10" value="100">' +
          '<p class="field-error" id="piErr" hidden></p></div>',
        onConfirm: function (h2) {
          const v = parseNum($('#piG', h2.el).value);
          if (isNaN(v) || v <= 0 || v > 5000) {
            const err = $('#piErr', h2.el); err.hidden = false;
            err.textContent = 'Introduce una cantidad entre 1 y 5000.';
            return;
          }
          cb({ foodId: f.id, grams: round(v, 1) });
          h2.close(true);
          h.close(true);
        }
      });
    });
  },


  /* Duplicar un día o una ingesta desde otra fecha */
  duplicate: function (targetKey, mealId) {
    const withData = Object.keys(State.data.days).filter(function (k) {
      if (k === targetKey) return false;
      const d = State.data.days[k];
      return MEALS.some(function (m) { return (d.meals[m.id] || []).length > 0; });
    }).sort().reverse().slice(0, 30);


    if (!withData.length) {
      Dialog.alert('Nada que copiar', 'Todavía no hay otros días con comidas registradas.');
      return;
    }
    const body = '<div class="block" style="padding-top:0"><div class="list">' +
      withData.map(function (k) {
        const t = dayTotals(k);
        const n = MEALS.reduce(function (a, m) { return a + (State.data.days[k].meals[m.id] || []).length; }, 0);
        return '<button type="button" class="row" data-dupfrom="' + k + '">' +
          '<span class="row-main"><span class="row-title">' + esc(fmtDateRelative(k)) + '</span>' +
          '<span class="row-sub">' + n + ' registros · ' + nf(t.kcal) + ' kcal</span></span>' +
          '<span class="row-chev">' + icon('chevR', 16, { w: 2.4 }) + '</span></button>';
      }).join('') + '</div></div>';


    const h = Sheet.open({
      title: mealId ? 'Copiar ingesta desde…' : 'Copiar día desde…',
      left: 'Cancelar', body: body
    });
    h.el.addEventListener('click', function (e) {
      const b = e.target.closest('[data-dupfrom]');
      if (!b) return;
      const from = b.getAttribute('data-dupfrom');
      State.update(function (s) {
        const dst = State.ensureDay(targetKey);
        const src = s.days[from];
        if (!src) return;
        MEALS.forEach(function (m) {
          if (mealId && m.id !== mealId) return;
          (src.meals[m.id] || []).forEach(function (e2) {
            dst.meals[m.id].push(Object.assign({}, e2, { id: uid('e') }));
          });
        });
      }, ['meal', 'day']);
      h.close(true);
      Toast.show('Registros copiados', 'check');
    });
  }
};

/* Construcción de las rutinas a partir de las tuplas. */
function buildRoutine(t) {
  return {
    id: t[0], name: t[1], purposes: t[2], level: t[3],
    days: t[4], minutes: t[5], summary: t[6],
    sessions: t[7].map(function (sx) {
      return { title: sx[0], blocks: sx[1].map(function (b) { return { ex: b[0], vol: b[1], rest: b[2] }; }) };
    }),
    note: t[8]
  };
}
const ROUTINES = ROUTINE_TUPLES.map(buildRoutine);
const ROUTINE_BY_ID = {};
ROUTINES.forEach(function (r) { ROUTINE_BY_ID[r.id] = r; });


function routineLevelName(id) {
  for (let i = 0; i < ROUTINE_LEVELS.length; i++) if (ROUTINE_LEVELS[i].id === id) return ROUTINE_LEVELS[i].n;
  return '';
}

/* ==========================================================================
   RACHAS E HITOS
   La racha cuenta días consecutivos cumpliendo tres de los cuatro objetivos.
   Los hitos se calculan siempre desde los datos reales; ninguno se «desbloquea»
   ni se guarda aparte, así que borrar registros los recalcula hacia atrás.


   El tono es deliberadamente neutro: informa de lo conseguido y no reprocha lo
   que falta. Una racha rota no dice nada sobre nadie.
   ========================================================================== */


/** Racha más larga registrada, no solo la actual. */
function bestStreak() {
  const keys = Object.keys(State.data.days).sort();
  if (!keys.length) return 0;
  let best = 0, run = 0, prev = null;
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    if (goalsMet(k).count < 3) { run = 0; prev = k; continue; }
    run = (prev && daysBetween(prev, k) === 1 && goalsMet(prev).count >= 3) ? run + 1 : 1;
    if (run > best) best = run;
    prev = k;
  }
  return best;
}


/** Cifras acumuladas que alimentan los hitos. */
function lifetimeStats() {
  const days = State.data.days;
  const keys = Object.keys(days);
  let workouts = 0, workoutMin = 0, logged = 0, goalDays = 0, notes = 0;
  keys.forEach(function (k) {
    const d = days[k];
    workouts += (d.workouts || []).length;
    workoutMin += sum(d.workouts || [], function (w) { return w.min || 0; });
    if (MEALS.some(function (m) { return (d.meals[m.id] || []).length; })) logged++;
    if (goalsMet(k).count >= 3) goalDays++;
    if (d.note && d.note.trim()) notes++;
  });
  return {
    days: keys.length, logged: logged, goalDays: goalDays,
    workouts: workouts, workoutMin: workoutMin, notes: notes,
    weights: State.data.weights.length,
    streak: currentStreak(), best: bestStreak()
  };
}

                '<span class="bar thin"><i style="width:' + round(pct, 1) + '%;background:var(--accent)"></i></span>' +
              '</span>' +
              '<span class="ms-val">' + nf(Math.min(v, m.goal)) + '<small>/' + nf(m.goal) + '</small></span>' +
            '</div>';
          }).join('') +
        '</div></div>';
      }).join('') +


      '<p class="section-footer" style="padding-bottom:20px">Los hitos se calculan desde tus registros cada vez que abres esta pantalla. ' +
      'Si borras datos, se recalculan hacia atrás.</p>';


    Sheet.open({ title: 'Rachas e hitos', left: 'Cerrar', body: body });
  }
};


/* ==========================================================================
   DESPENSA — «¿qué puedo cocinar con lo que tengo?»
   Es el reverso de la lista de la compra: en vez de elegir recetas y deducir
   qué comprar, se marca lo que hay en casa y se deduce qué se puede cocinar.


   El detalle que hace la diferencia entre útil e inútil: los básicos. Nadie
   marca la sal, el aceite o el orégano uno por uno, y exigirlos haría que
   ninguna receta encajase nunca. Por eso hay un interruptor que da por
   supuestos los condimentos de fondo de armario, activado de serie.
   ========================================================================== */


/* Categorías que se consideran fondo de armario cuando el interruptor está
   activo, más algunos sueltos que no encajan en esas categorías. */
const PANTRY_BASIC_CATS = { especia: 1, grasa: 1 };
const PANTRY_BASIC_IDS = { f305: 1, f304: 1, f303: 1, f240: 1, f279: 1, f048: 1, f034: 1 };


function isPantryBasic(f) {
  return !!(f && (PANTRY_BASIC_CATS[f.cat] || PANTRY_BASIC_IDS[f.id]));
}


/** ¿Se da por disponible este ingrediente? */
function hasIngredient(id) {
  if (State.data.pantry.indexOf(id) >= 0) return true;
  if (!State.data.settings.pantryBasics) return false;
  return isPantryBasic(FOOD_BY_ID[id]);
}


/** Ingredientes de una receta que no están disponibles ahora mismo. */
function missingFor(r) {
  return r.ing.filter(function (i) { return !hasIngredient(i.id); });
}


const PantryFlow = {
  /** Resultado: recetas ordenadas por lo poco que falta para hacerlas. */
  open: function (key, mealId) {
    function build() {
      const scored = BASE_RECIPES.map(function (r) {
        const miss = missingFor(r);
        return { r: r, miss: miss, n: miss.length };
      }).filter(function (x) {
        // Más de tres ingredientes de diferencia ya no es «cocinar con lo que
        // tengo», es hacer la compra: no aporta mostrarlo.
        return x.n <= 3;
      }).sort(function (a, b) {
        if (a.n !== b.n) return a.n - b.n;
        if (a.r.minutes !== b.r.minutes) return a.r.minutes - b.r.minutes;
        return a.r.id < b.r.id ? -1 : 1;
      });
      return scored;
    }


    function card(x) {
      const r = x.r, ps = r.perServing;
      const label = x.n === 0 ? 'Puedes hacerla ya'
        : (x.n === 1 ? 'Te falta 1 ingrediente' : 'Te faltan ' + x.n + ' ingredientes');
      return '<button type="button" class="recipe-card pantry-card" data-popen="' + esc(r.id) + '">' +
        '<span class="rc-top">' +
          '<span class="rc-name">' + esc(r.name) + '</span>' +
          '<span class="rc-kcal">' + nf(ps.kcal) + '<small>kcal</small></span>' +
        '</span>' +
        '<span class="rc-meta">' + icon('clock', 13, { w: 2.2 }) + r.minutes + ' min · ' +
          esc(recipeCatName(r.cat)) + '</span>' +
        '<span class="pantry-state ' + (x.n === 0 ? 'ok' : 'miss') + '">' +
          icon(x.n === 0 ? 'check' : 'plus', 13, { w: 2.6 }) + esc(label) +
        '</span>' +
        (x.n ? '<span class="pantry-miss">' + x.miss.map(function (m) {
          return esc(m.name);
        }).join(' · ') + '</span>' : '') +
      '</button>';
    }


    function bodyHtml() {
      const n = State.data.pantry.length;
      const list = build();
      const ready = list.filter(function (x) { return x.n === 0; });
      const near = list.filter(function (x) { return x.n > 0; });


      const header =
        '<div class="block" style="padding-top:0"><div class="list">' +
          rowLink({
            title: 'Lo que tengo en casa',
            sub: n ? n + (n === 1 ? ' alimento marcado' : ' alimentos marcados') : 'Todavía no has marcado nada',
            ico: 'check', color: '--mint', attrs: 'data-pedit'
          }) +
          switchRow('Doy por hecho los básicos', State.data.settings.pantryBasics,
            'data-pbasics', 'Sal, aceite, vinagre, ajo, cebolla y especias') +
        '</div></div>';


      if (!n) {
        return header + '<div class="block">' + emptyState('bowl', 'Marca lo que tienes',
          'Añade los alimentos que tengas en casa y verás qué recetas del recetario puedes cocinar sin comprar nada.',
          'Elegir alimentos', 'data-pedit') + '</div>';
      }
      if (!list.length) {
        return header + '<div class="block">' + emptyState('search', 'Nada a menos de tres ingredientes',
          'Con lo marcado no hay ninguna receta cerca. Añade algún alimento más y vuelve a mirar.',
          'Añadir alimentos', 'data-pedit') + '</div>';
      }


      return header +
        (ready.length
          ? '<div class="section-header">Puedes cocinarlas ya · ' + ready.length + '</div>' +
            '<div class="block-tight">' + ready.map(card).join('') + '</div>'
          : '') +
        (near.length
          ? '<div class="section-header">Casi · te falta poco</div>' +
            '<div class="block-tight">' + near.map(card).join('') + '</div>'
          : '') +
        '<p class="section-footer" style="padding-bottom:20px">Solo se comparan los ingredientes, no las cantidades: ' +
        'que tengas arroz no significa que tengas 300 g.</p>';
    }


    const h = Sheet.open({ title: 'Con lo que tengo', left: 'Cerrar', body: '<div id="pBody">' + bodyHtml() + '</div>' });


    function repaint() { $('#pBody', h.el).innerHTML = bodyHtml(); }


    h.el.addEventListener('click', function (e) {
      if (e.target.closest('[data-pbasics]')) {
        State.update(function (st) { st.settings.pantryBasics = !st.settings.pantryBasics; }, ['settings']);
        repaint();
        return;
      }
      if (e.target.closest('[data-pedit]')) { PantryFlow.edit(repaint); return; }
      const open = e.target.closest('[data-popen]');
      if (open) {
        const r = RECIPE_BY_ID[open.getAttribute('data-popen')];
        if (r) RecipeFlow.detail(r, key, mealId);
      }
    });
  },


  /** Selección de alimentos, con buscador porque aquí sí hay cientos. */
  edit: function (onDone) {
    let q = '';


    function results() {
      const nq = norm(q).trim();
      // Sin búsqueda se muestra lo ya marcado, para poder desmarcar rápido.
      if (!nq) {
        const mine = State.data.pantry.map(function (id) { return FoodIndex.get(id); }).filter(Boolean);
        return { title: mine.length ? 'En tu despensa' : '', list: mine };
      }
      return { title: 'Resultados', list: FoodIndex.search(q, 'all', 40) };
    }


    function listHtml() {
      const r = results();
      if (!r.list.length) {
        return '<div class="block">' + emptyState('search',
          q ? 'Sin resultados' : 'Despensa vacía',
          q ? 'Prueba con otro nombre: busca por ingrediente, no por plato.'
            : 'Busca arriba los alimentos que tengas en casa y tócalos para añadirlos.') + '</div>';
      }
      return (r.title ? '<div class="section-header">' + esc(r.title) + '</div>' : '') +
        '<div class="block-tight"><div class="list">' + r.list.map(function (f) {
          const on = State.data.pantry.indexOf(f.id) >= 0;
          return '<button type="button" class="row shop-item' + (on ? ' done' : '') + '" data-ptoggle="' + esc(f.id) + '"' +
            ' aria-pressed="' + (on ? 'true' : 'false') + '">' +
            '<span class="shop-box" aria-hidden="true">' + (on ? icon('check', 14, { w: 3 }) : '') + '</span>' +
            '<span class="row-main"><span class="row-title">' + esc(f.name) + '</span>' +
            '<span class="row-sub">' + esc(categoryOf(f.cat).n) + '</span></span>' +
          '</button>';
        }).join('') + '</div></div>';
    }


    const h = Sheet.open({
      title: 'Lo que tengo en casa', left: 'Hecho',
      onClose: function () { if (onDone) onDone(); },
      body: '<div class="searchbar"><div class="sb-inner">' +
          icon('search', 17, { w: 2.2 }) +
          '<input id="pSearch" type="search" placeholder="Buscar alimento" autocomplete="off" aria-label="Buscar alimento">' +
        '</div></div><div id="pList">' + listHtml() + '</div>'
    });


    const inp = $('#pSearch', h.el);
    inp.addEventListener('input', function () {
      q = inp.value;
      $('#pList', h.el).innerHTML = listHtml();
    });


    h.el.addEventListener('click', function (e) {
      const t = e.target.closest('[data-ptoggle]');
      if (!t) return;
      const id = t.getAttribute('data-ptoggle');
      State.update(function (st) {
        const i = st.pantry.indexOf(id);
        if (i >= 0) st.pantry.splice(i, 1); else st.pantry.push(id);
      }, ['pantry']);
      pulse(t);
      $('#pList', h.el).innerHTML = listHtml();
    });
  }
};


/* ==========================================================================
   RECETAS — navegación y ficha
   ========================================================================== */
const RecipeFlow = {
  /** Listado completo agrupado por apartados. Sin buscador a propósito.
      Con más de doscientas recetas la clave no es teclear, es acotar: los
      chips filtran, el orden reordena y las cabeceras quedan fijas al
      desplazarse para no perder de vista en qué apartado estás. */
  browse: function (key, mealId) {
    let cat = 'all';
    let sort = 'def';
    const active = {};


    function activeIds() { return Object.keys(active).filter(function (k) { return active[k]; }); }


    function inCat(r) {
      if (cat === 'all') return true;
      if (cat === 'fav') return isFavRecipe(r.id);
      return r.cat === cat;
    }
    function matches(r) {
      if (!inCat(r)) return false;
      const ids = activeIds();
      for (let i = 0; i < ids.length; i++) if (r.badges.indexOf(ids[i]) < 0) return false;
      return true;
    }


    /* El orden por defecto es el del catálogo, que agrupa por afinidad. Los
       demás resuelven preguntas concretas: «lo más ligero», «lo que más
       proteína tiene», «lo que puedo hacer en nada». */
    const SORTS = [
      { id: 'def',  n: 'Sugerido', f: null },
      { id: 'kcal', n: 'Menos kcal', f: function (a, b) { return a.perServing.kcal - b.perServing.kcal; } },
      { id: 'prot', n: 'Más proteína', f: function (a, b) { return b.perServing.prot - a.perServing.prot; } },
      { id: 'time', n: 'Más rápidas', f: function (a, b) { return a.minutes - b.minutes || a.perServing.kcal - b.perServing.kcal; } }
    ];
    function sortFn() {
      const sd = SORTS.filter(function (x) { return x.id === sort; })[0];
      return sd ? sd.f : null;
    }


    function card(r) {
      const ps = r.perServing;
      const fav = isFavRecipe(r.id);
      return '<div class="recipe-wrap">' +
        '<button type="button" class="rc-star' + (fav ? ' on' : '') + '" data-rfav="' + esc(r.id) + '"' +
          ' aria-pressed="' + (fav ? 'true' : 'false') + '"' +
          ' aria-label="' + (fav ? 'Quitar de favoritas' : 'Marcar como favorita') + '">' +
          icon('star', 19, { w: 1.9, fill: fav }) + '</button>' +
        '<button type="button" class="recipe-card" data-ropen="' + esc(r.id) + '">' +
        '<span class="rc-top">' +
          '<span class="rc-name">' + esc(r.name) + '</span>' +
          '<span class="rc-kcal">' + nf(ps.kcal) + '<small>kcal</small></span>' +
        '</span>' +
        '<span class="rc-meta">' + icon('clock', 13, { w: 2.2 }) + r.minutes + ' min · ' +
          r.servings + (r.servings === 1 ? ' ración' : ' raciones') + ' · ' + nf(r.servingG) + ' g por ración</span>' +
        '<span class="rc-macros">' +
          '<i style="background:var(--c-nutri)"></i>P ' + nf(ps.prot, 1) + ' g' +
          '<i style="background:var(--c-act)"></i>H ' + nf(ps.carb, 1) + ' g' +
          '<i style="background:var(--c-sleep)"></i>G ' + nf(ps.fat, 1) + ' g' +
        '</span>' +
        (r.badges.length || r.tags.length ? '<span class="rc-tags">' +
          r.badges.map(function (b) { return '<em class="calc">' + esc(filterName(b)) + '</em>'; }).join('') +
          r.tags.map(function (t) { return '<em>' + esc(t) + '</em>'; }).join('') +
        '</span>' : '') +
      '</button></div>';
    }


    function chipsHtml() {
      const nFav = State.data.favRecipes.length;
      return '<div class="chip-scroll" id="rTabs">' +
          '<button type="button" class="chip" data-rcat="all" aria-pressed="' + (cat === 'all') + '">Todas <b>' + BASE_RECIPES.length + '</b></button>' +
          (nFav ? '<button type="button" class="chip" data-rcat="fav" aria-pressed="' + (cat === 'fav') + '">' +
            icon('star', 13, { w: 2.2, fill: true }) + ' Favoritas <b>' + nFav + '</b></button>' : '') +
          RECIPE_CATS.map(function (c) {
            const n = BASE_RECIPES.filter(function (r) { return r.cat === c.id; }).length;
            return '<button type="button" class="chip" data-rcat="' + esc(c.id) + '" aria-pressed="' +
              (cat === c.id) + '">' + esc(c.n) + ' <b>' + n + '</b></button>';
          }).join('') +
        '</div>' +
        '<div class="filter-bar">' +
          '<div class="chip-scroll tight" id="rFilters">' +
            RECIPE_FILTERS.map(function (f) {
              const would = BASE_RECIPES.filter(function (r) {
                if (!inCat(r)) return false;
                const ids = activeIds().concat(active[f.id] ? [] : [f.id]);
                for (let i = 0; i < ids.length; i++) if (r.badges.indexOf(ids[i]) < 0) return false;
                return true;
              }).length;
              return '<button type="button" class="chip filt" data-rfilt="' + esc(f.id) + '"' +
                ' aria-pressed="' + (active[f.id] ? 'true' : 'false') + '"' +
                (!active[f.id] && would === 0 ? ' disabled' : '') + '>' +
                esc(f.n) + ' <b>' + would + '</b></button>';
            }).join('') +
          '</div>' +
          (activeIds().length ? '<button type="button" class="chip clear" data-rclear>' +
            icon('close', 13, { w: 2.6 }) + 'Quitar</button>' : '') +
        '</div>' +
        '<div class="sort-bar">' + segmented(SORTS, sort, 'data-rsort', 'Ordenar las recetas') + '</div>';
    }


    function listHtml() {
      const total = BASE_RECIPES.filter(matches).length;
      if (cat === 'fav' && !State.data.favRecipes.length) {
        return '<div class="block">' + emptyState('star', 'Todavía no tienes favoritas',
          'Toca la estrella de una receta para tenerla siempre a mano aquí.') + '</div>';
      }
      if (!total) {
        return '<div class="block">' + emptyState('book', 'Ninguna receta cumple todo eso',
          'Has combinado filtros que no coinciden en ninguna receta. Quita alguno para ver resultados.',
          'Quitar filtros', 'data-rclear') + '</div>';
      }


      const cmp = sortFn();
      const head = (activeIds().length || sort !== 'def')
        ? '<p class="hint" style="padding:4px 16px 0">' + total +
          (total === 1 ? ' receta' : ' recetas') + (activeIds().length ? ' con estos filtros' : '') + '.</p>'
        : '';


      /* Al ordenar por un criterio se rompe la agrupación por apartado: mezclar
         orden y secciones daría una lista incoherente («la más ligera de cada
         apartado» no es lo que se pide al ordenar). */
      if (cmp) {
        const all = BASE_RECIPES.filter(matches).slice().sort(cmp);
        return head + '<div class="block-tight">' + all.map(card).join('') + '</div>';
      }


      const cats = (cat === 'all' || cat === 'fav')
        ? RECIPE_CATS : RECIPE_CATS.filter(function (c) { return c.id === cat; });
      return head + cats.map(function (c) {
        const list = BASE_RECIPES.filter(function (r) { return r.cat === c.id && matches(r); });
        if (!list.length) return '';
        return '<div class="section-header sticky">' + esc(c.n) + ' · ' + list.length + '</div>' +
          '<div class="block-tight">' + list.map(card).join('') + '</div>';
      }).join('');
    }


    const h = Sheet.open({
      title: 'Recetario', left: 'Cerrar',
      body: '<div id="rChips">' + chipsHtml() + '</div><div id="rResults">' + listHtml() + '</div>'
    });


    function repaint(toTop) {
      $('#rChips', h.el).innerHTML = chipsHtml();
      $('#rResults', h.el).innerHTML = listHtml();
      if (toTop) { const b = $('.sheet-body', h.el); if (b) b.scrollTop = 0; }
    }


    h.el.addEventListener('click', function (e) {
      const tab = e.target.closest('[data-rcat]');
      if (tab) { cat = tab.getAttribute('data-rcat'); repaint(true); return; }


      const so = e.target.closest('[data-rsort]');
      if (so) { sort = so.getAttribute('data-rsort'); repaint(true); return; }


      const filt = e.target.closest('[data-rfilt]');
      if (filt) {
        if (filt.disabled) return;
        const id = filt.getAttribute('data-rfilt');
        if (active[id]) delete active[id]; else active[id] = true;
        repaint(false);
        return;
      }


      if (e.target.closest('[data-rclear]')) {
        Object.keys(active).forEach(function (k) { delete active[k]; });
        repaint(true);
        return;
      }


      const star = e.target.closest('[data-rfav]');
      if (star) {
        const id = star.getAttribute('data-rfav');
        const on = toggleFavRecipe(id);
        pulse(star);
        if (cat === 'fav' || !State.data.favRecipes.length) repaint(false);
        else {
          star.classList.toggle('on', on);
          star.setAttribute('aria-pressed', on ? 'true' : 'false');
          star.setAttribute('aria-label', on ? 'Quitar de favoritas' : 'Marcar como favorita');
          star.innerHTML = icon('star', 19, { w: 1.9, fill: on });
          $('#rChips', h.el).innerHTML = chipsHtml();
        }
        Toast.show(on ? 'Añadida a favoritas' : 'Quitada de favoritas', on ? 'star' : 'check');
        return;
      }


      const open = e.target.closest('[data-ropen]');
      if (open) {
        const r = RECIPE_BY_ID[open.getAttribute('data-ropen')];
        if (r) RecipeFlow.detail(r, key, mealId);
      }
    });
  },


  /** Ficha con ingredientes escalables, pasos y nutrición. */
  detail: function (r, key, mealId) {
    let servings = r.servings;


    const h = Sheet.open({
      title: r.name, left: 'Cerrar',
      body: '<div id="rcBody"></div>',
      footer: '<button type="button" class="btn primary full lg" data-radd>Añadir una ración a mi día</button>'
    });


    function paint() {
      const f = servings / r.servings;
      const ps = r.perServing;
      const box = $('#rcBody', h.el);
      if (!box) return;
      box.innerHTML =
        '<div class="block" style="padding-top:0">' +
          '<div class="card">' +
            '<div class="rd-head">' +
              '<span class="rd-meta">' + icon('clock', 13, { w: 2.2 }) + esc(recipeCatName(r.cat)) + ' · ' + r.minutes + ' min</span>' +
              (r.badges.length || r.tags.length ? '<span class="rc-tags">' +
                r.badges.map(function (b) {
                  return '<button type="button" class="tag-btn calc" data-why="' + esc(b) + '">' +
                    esc(filterName(b)) + '</button>';
                }).join('') +
                r.tags.map(function (t) { return '<em>' + esc(t) + '</em>'; }).join('') +
              '</span>' : '') +
            '</div>' +
            '<div class="kcal-hero" style="padding-bottom:8px">' +
              '<div class="kh-num">' + nf(ps.kcal) + '</div>' +
              '<div class="kh-lab">kcal por ración · ' + nf(r.servingG) + ' g</div>' +
            '</div>' +
            '<div class="nutri-grid">' +
              '<div><b>' + nf(ps.prot, 1) + '</b><span>Proteínas</span></div>' +
              '<div><b>' + nf(ps.carb, 1) + '</b><span>Hidratos</span></div>' +
              '<div><b>' + nf(ps.fat, 1) + '</b><span>Grasas</span></div>' +
              '<div><b>' + nf(ps.fib, 1) + '</b><span>Fibra</span></div>' +
            '</div>' +
            '<p class="card-note" style="margin-top:12px">Calculado sumando los ingredientes del catálogo, no estimado a ojo. ' +
              'Por 100 g: ' + nf(r.per100.kcal) + ' kcal.</p>' +
          '</div>' +
        '</div>' +


        '<div class="section-header">Ingredientes</div>' +
        '<div class="block-tight">' +
          '<div class="rd-serv">' +
            '<span>Raciones</span>' +
            '<div class="stepper compact">' +
              '<button type="button" class="sbtn" data-rs="-1" aria-label="Menos raciones">' + icon('minus', 18, { w: 2.4 }) + '</button>' +
              '<b aria-live="polite">' + servings + '</b>' +
              '<button type="button" class="sbtn" data-rs="1" aria-label="Más raciones">' + icon('plus', 18, { w: 2.4 }) + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="list" style="margin-top:10px">' +
            r.ing.map(function (i) {
              const g = i.g * f;
              return '<div class="row"><span class="row-main"><span class="row-title">' + esc(i.name) + '</span></span>' +
                '<span class="row-value">' + esc(fmtIngredient(g, i.base)) + '</span></div>';
            }).join('') +
          '</div>' +
        '</div>' +


        '<div class="section-header">Elaboración</div>' +
        '<div class="block">' +
          '<ol class="rd-steps">' + r.steps.map(function (st) {
            return '<li>' + esc(st) + '</li>';
          }).join('') + '</ol>' +
        '</div>';
    }
    paint();


    h.el.addEventListener('click', function (e) {
      const why = e.target.closest('[data-why]');
      if (why) {
        const f = RECIPE_FILTERS.filter(function (x) { return x.id === why.getAttribute('data-why'); })[0];
        if (f) Dialog.alert(f.n, f.why);
        return;
      }
      const st = e.target.closest('[data-rs]');
      if (st) {
        const d = parseInt(st.getAttribute('data-rs'), 10);
        servings = clamp(servings + d, 1, 20);
        paint();
        return;
      }
      if (e.target.closest('[data-radd]')) {
        const food = FoodIndex.get(r.id);
        if (!food) return;
        const targetKey = key || todayKey();
        const targetMeal = mealId || ViewFood.defaultMeal();
        FoodFlow.quantity(food, targetKey, targetMeal, null);
      }
    });
  }
};


/* --------------------------------------------------------------------------
   SUGERENCIAS DE RECETA SEGÚN LO QUE FALTA DEL DÍA
   Cruza lo ya registrado con los objetivos y propone recetas del catálogo que
   quepan en lo que queda. Es determinista: mismas cifras, mismas recetas.
   No aparece si el día ya está cubierto, si queda muy poco margen o si se
   está consultando una fecha pasada, donde una sugerencia no sirve de nada.
   -------------------------------------------------------------------------- */
function suggestRecipes(key, max) {
  if (key !== todayKey()) return null;
  const g = State.data.goals;
  const t = dayTotals(key);
  const remKcal = kcalGoalFor(key) - t.kcal;
  const remProt = (g.prot || 0) - t.prot;


  // Por debajo de 250 kcal restantes no cabe un plato: sugerir sería ruido.
  if (remKcal < 250) return null;


  const gapProt = Math.max(0, remProt);
  const cands = BASE_RECIPES.filter(function (r) {
    // Se admite un 10 % de holgura: cuadrar al kcal exacto no es realista.
    return r.perServing.kcal > 0 && r.perServing.kcal <= remKcal * 1.1;
  });
  if (!cands.length) return null;


  const scored = cands.map(function (r) {
    const ps = r.perServing;
    // Cuánto del hueco de proteína cubre esta ración, sin premiar el exceso.
    const protFit = gapProt > 0 ? Math.min(1, ps.prot / gapProt) : 0;
    // Cuánto del hueco calórico ocupa: se prefiere llenarlo sin pasarse.
    const kcalFit = 1 - Math.abs(remKcal - ps.kcal) / remKcal;
    const score = gapProt > 0 ? protFit * 0.7 + kcalFit * 0.3 : kcalFit;
    return { r: r, score: score };
  }).sort(function (a, b) {
    if (b.score !== a.score) return b.score - a.score;
    return a.r.id < b.r.id ? -1 : 1;   // desempate estable
  });


  return {
    remKcal: Math.round(remKcal),
    remProt: Math.round(gapProt),
    list: scored.slice(0, max || 3).map(function (x) { return x.r; })
  };
}

    if (i >= 0) st.favRecipes.splice(i, 1);

}

/** Cantidad de un ingrediente redondeada a algo que se pueda medir en cocina. */

/* ==========================================================================
   LISTA DE LA COMPRA
   Se construye seleccionando recetas del recetario y el número de raciones de
   cada una. Los ingredientes repetidos se agregan sumando gramos, y el
   resultado se agrupa por categoría de alimento para recorrer el súper por
   pasillos en lugar de dar vueltas.
   ========================================================================== */
const ShoppingFlow = {
  /** Selección de recetas y raciones. */
  open: function () {
    const picked = {};   // id de receta -> raciones


    function totalRecipes() { return Object.keys(picked).length; }


    function bodyHtml() {
      return RECIPE_CATS.map(function (c) {
        const list = BASE_RECIPES.filter(function (r) { return r.cat === c.id; });
        if (!list.length) return '';
        return '<div class="section-header">' + esc(c.n) + '</div>' +
          '<div class="block-tight"><div class="list">' + list.map(function (r) {
            const n = picked[r.id] || 0;
            return '<div class="row shop-row' + (n ? ' on' : '') + '" data-shoprow="' + esc(r.id) + '">' +
              '<span class="row-main">' +
                '<span class="row-title">' + esc(r.name) + '</span>' +
                '<span class="row-sub">' + r.servings + (r.servings === 1 ? ' ración base' : ' raciones base') +
                  ' · ' + nf(r.perServing.kcal) + ' kcal</span>' +
              '</span>' +
              '<span class="stepper compact shop-step">' +
                '<button type="button" class="sbtn" data-shop="-1" data-rid="' + esc(r.id) + '" aria-label="Quitar una ración de ' + esc(r.name) + '"' +
                  (n ? '' : ' disabled') + '>' + icon('minus', 16, { w: 2.4 }) + '</button>' +
                '<b aria-live="polite">' + n + '</b>' +
                '<button type="button" class="sbtn" data-shop="1" data-rid="' + esc(r.id) + '" aria-label="Añadir una ración de ' + esc(r.name) + '">' +
                  icon('plus', 16, { w: 2.4 }) + '</button>' +
              '</span>' +
            '</div>';
          }).join('') + '</div></div>';
      }).join('') + '<div style="height:12px"></div>';
    }


    const h = Sheet.open({
      title: 'Planificar la compra', left: 'Cerrar',
      body: '<p class="hint" style="padding:0 16px 4px">Elige cuántas raciones quieres cocinar de cada receta. ' +
            'Después se agrupan los ingredientes por pasillo.</p><div id="shopBody">' + bodyHtml() + '</div>',
      footer: '<button type="button" class="btn primary full lg" data-shopgo disabled>Generar la lista</button>'
    });


    function syncFooter() {
      const btn = $('[data-shopgo]', h.el);
      if (!btn) return;
      const n = totalRecipes();
      btn.disabled = n === 0;
      btn.textContent = n === 0 ? 'Generar la lista'
        : 'Generar la lista · ' + n + (n === 1 ? ' receta' : ' recetas');
    }
    syncFooter();


    h.el.addEventListener('click', function (e) {
      const step = e.target.closest('[data-shop]');
      if (step) {
        const id = step.getAttribute('data-rid');
        const r = RECIPE_BY_ID[id];
        if (!r) return;
        const d = Number(step.getAttribute('data-shop'));
        const next = clamp((picked[id] || 0) + d * r.servings, 0, 60);
        if (next <= 0) delete picked[id]; else picked[id] = next;
        pulse(step);
        $('#shopBody', h.el).innerHTML = bodyHtml();
        syncFooter();
        return;
      }
      if (e.target.closest('[data-shopgo]')) {
        if (!totalRecipes()) return;
        ShoppingFlow.result(picked);
      }
    });
  },


  /** Lista agregada por categoría, con lo ya marcado al final. */
  result: function (picked) {
    /* Agregación: mismo alimento en varias recetas suma gramos una sola vez. */
    const agg = {};
    Object.keys(picked).forEach(function (rid) {
      const r = RECIPE_BY_ID[rid];
      if (!r) return;
      const factor = picked[rid] / r.servings;
      r.ing.forEach(function (i) {
        if (!agg[i.id]) agg[i.id] = { id: i.id, name: i.name, g: 0, base: i.base, from: [] };
        agg[i.id].g += i.g * factor;
        if (agg[i.id].from.indexOf(r.name) < 0) agg[i.id].from.push(r.name);
      });
    });


    const items = Object.keys(agg).map(function (id) { return agg[id]; });
    const byCat = {};
    items.forEach(function (it) {
      const f = FOOD_BY_ID[it.id];
      const cat = f ? f.cat : 'otros';
      (byCat[cat] = byCat[cat] || []).push(it);
    });


    const done = {};   // marcado en la sesión, no se persiste


    function listHtml() {
      const cats = CATEGORIES.filter(function (c) { return byCat[c.id]; });
      const nTotal = items.length;
      const nDone = Object.keys(done).filter(function (k) { return done[k]; }).length;
      return '<div class="block" style="padding-top:0"><div class="card">' +
          '<div class="kcal-hero" style="padding:4px 0 8px">' +
            '<div class="kh-num">' + nDone + '<span style="font:600 22px/26px var(--font);color:var(--txt-2)"> / ' + nTotal + '</span></div>' +
            '<div class="kh-lab">artículos en el carro</div>' +
          '</div>' +
          '<div class="bar" style="margin-top:4px"><i style="width:' +
            round(nTotal ? nDone / nTotal * 100 : 0, 1) + '%;background:var(--accent)"></i></div>' +
        '</div></div>' +
        cats.map(function (c) {
          const list = byCat[c.id].slice().sort(function (a, b) { return a.name < b.name ? -1 : 1; });
          return '<div class="section-header">' + esc(c.n) + '</div>' +
            '<div class="block-tight"><div class="list">' + list.map(function (it) {
              const on = !!done[it.id];
              return '<button type="button" class="row shop-item' + (on ? ' done' : '') + '" data-shopcheck="' + esc(it.id) + '"' +
                ' aria-pressed="' + (on ? 'true' : 'false') + '">' +
                '<span class="shop-box" aria-hidden="true">' + (on ? icon('check', 14, { w: 3 }) : '') + '</span>' +
                '<span class="row-main">' +
                  '<span class="row-title">' + esc(it.name) + '</span>' +
                  '<span class="row-sub">' + esc(it.from.join(' · ')) + '</span>' +
                '</span>' +
                '<span class="row-value">' + esc(fmtShopQty(it.g, it.base)) + '</span>' +
              '</button>';
            }).join('') + '</div></div>';
        }).join('') +
        '<p class="section-footer" style="padding-bottom:20px">Las cantidades son las de los ingredientes en crudo. ' +
        'Lo que marques aquí no se guarda al cerrar.</p>';
    }


    const h = Sheet.open({
      title: 'Lista de la compra', left: 'Cerrar',
      body: '<div id="shopList">' + listHtml() + '</div>',
      footer: '<button type="button" class="btn tinted full" data-shopcopy>Copiar la lista como texto</button>'
    });


    h.el.addEventListener('click', function (e) {
      const chk = e.target.closest('[data-shopcheck]');
      if (chk) {
        const id = chk.getAttribute('data-shopcheck');
        done[id] = !done[id];
        $('#shopList', h.el).innerHTML = listHtml();
        return;
      }
      if (e.target.closest('[data-shopcopy]')) {
        const txt = CATEGORIES.filter(function (c) { return byCat[c.id]; }).map(function (c) {
          return c.n.toUpperCase() + '\\n' + byCat[c.id].slice()
            .sort(function (a, b) { return a.name < b.name ? -1 : 1; })
            .map(function (it) { return '- ' + it.name + ': ' + fmtShopQty(it.g, it.base); }).join('\\n');
        }).join('\\n\\n');
        copyText(txt);
      }
    });
  }
};


/** Cantidad de compra redondeada a algo que se pida en una tienda. */
function fmtShopQty(g, base) {
  const u = base === 'ml' ? 'ml' : 'g';
  if (base !== 'ml' && g >= 1000) return nf(round(g / 1000, 2)) + ' kg';
  if (base === 'ml' && g >= 1000) return nf(round(g / 1000, 2)) + ' l';
  if (g < 10) return nf(round(g, 1)) + ' ' + u;
  return nf(Math.round(g / 5) * 5) + ' ' + u;
}


/** Copia al portapapeles con reserva para navegadores sin permiso. */
function copyText(txt) {
  function fallback() {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:absolute;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      Toast.show(ok ? 'Lista copiada' : 'No se ha podido copiar', ok ? 'check' : 'warn');
    } catch (e) {
      Toast.show('No se ha podido copiar', 'warn');
    }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt)
        .then(function () { Toast.show('Lista copiada', 'check'); })
        .catch(fallback);
    } else fallback();
  } catch (e) { fallback(); }
}

/** ¿Se está sirviendo la app desde un origen que permite OAuth? */
function isSecureOrigin() {
  try {
    return typeof location !== 'undefined' && /^https?:$/.test(location.protocol) && location.origin !== 'null';
  } catch (e) { return false; }
}


/** «hace 3 minutos», «ayer»… para la última sincronización. */
function fmtRelative(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return 'hace unos segundos';
  const m = Math.round(s / 60);
  if (m < 60) return 'hace ' + m + (m === 1 ? ' minuto' : ' minutos');
  const h = Math.round(m / 60);
  if (h < 24) return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
  const d = Math.round(h / 24);
  return 'hace ' + d + (d === 1 ? ' día' : ' días');
}

      html += '<div class="card"><div class="card-head"><span class="card-title"><i class="dot" style="background:var(--c-act)"></i>Entrenamientos</span>' +
        '<span class="card-note">' + minutesToHM(workoutMinTotal(key)) + ' · ' + nf(workoutKcalTotal(key)) + ' kcal</span></div>' +

            '<span class="row-value">' + nf(wk.kcal) + ' kcal</span></div>';

  mount: function (root) {
    const self = this;
    Rings.animate(root);


    delegate(root, 'click', 'data-sug', function (el) {
      const r = RECIPE_BY_ID[el.getAttribute('data-sug')];
      if (r) RecipeFlow.detail(r, self.date, ViewFood.defaultMeal());
    });


    delegate(root, 'click', 'data-act', function (el) {
      const act = el.getAttribute('data-act');
      const key = self.date;
      if (act === 'day-prev') { self.date = addDays(self.date, -1); Router.rerender(true); return; }
      if (act === 'day-next') {
        if (self.date >= todayKey()) return;
        self.date = addDays(self.date, 1); Router.rerender(true); return;
      }
      if (act === 'today-jump') { self.date = todayKey(); Router.rerender(true); return; }
      if (act === 'qa-food') { ViewFood.date = key; FoodFlow.search(key, ViewFood.defaultMeal()); return; }
      if (act === 'qa-water') { Actions.water(key); return; }
      if (act === 'qa-steps') { Actions.steps(key); return; }
      if (act === 'qa-sleep') { Actions.sleep(key); return; }
      if (act === 'qa-workout') { Actions.workout(key, null); return; }
      if (act === 'qa-weight') { Actions.weight(null); return; }
      if (act === 'day-note') { ViewActivity.note(key); return; }
      if (act === 'streaks') { StreakFlow.open(); return; }
      if (act === 'water-quick') {
        pulse(el);
        Actions.addWater(key, Number(el.getAttribute('data-ml')));
        Toast.show('Agua registrada', 'drop');
      }
    });
  },


  /* Actualización puntual: al sumar agua basta con retocar cuatro nodos en
     lugar de repintar la pantalla entera. Si algo no encaja exactamente con
     lo que hay dibujado, se devuelve false y el enrutador repinta. */
  patch: function (tags) {
    if (tags.length !== 2 || tags.indexOf('water') < 0 || tags.indexOf('day') < 0) return false;
    const root = $('#screen');
    const key = this.date;
    if (!root || key > todayKey()) return false;
    const shown = root.querySelector('[data-streak]');
    if (!shown || Number(shown.getAttribute('data-streak')) !== currentStreak()) return false;
    const val = root.querySelector('[data-patch="water-val"]');
    const pct = root.querySelector('[data-patch="water-pct"]');
    const fill = root.querySelector('[data-patch="water-bar"]');
    const goals = root.querySelector('[data-patch="goals-count"]');
    if (!val || !pct || !fill || !goals) return false;
    const goal = State.data.goals.water;
    const ml = waterTotal(key);
    const p = goal ? ml / goal * 100 : 0;
    val.textContent = Units.volume(ml);
    pct.textContent = Math.round(p) + ' %';
    fill.style.width = clamp(p, 0, 100) + '%';
    const met = goalsMet(key);
    goals.textContent = met.count + ' de ' + met.total + ' objetivos cumplidos';
    return true;
  }
};

      }
      if (act === 'entry-open') {
        const mealId = el.getAttribute('data-meal');
        const entryId = el.getAttribute('data-entry');
        const entry = (State.day(key).meals[mealId] || []).filter(function (x) { return x.id === entryId; })[0];
        if (entry) ViewFood.entryOptions(key, mealId, entry);
        return;
      }
      if (act === 'my-foods') { ViewFood.manageFoods(); return; }
      if (act === 'recipes') RecipeFlow.browse(key, self.defaultMeal());
      if (act === 'shopping') ShoppingFlow.open();
      if (act === 'pantry') PantryFlow.open(key, self.defaultMeal());
      if (act === 'my-recipes') ViewFood.manageRecipes();
    });

  entryOptions: function (key, mealId, entry) {
    const body = '<div class="block" style="padding-top:0">' +
      '<div class="card" style="margin-bottom:16px">' +
        '<div class="card-title" style="margin-bottom:8px">' + esc(entry.name) + '</div>' +
        '<div class="card-note">' + esc(nf(entry.qty, 2) + ' ' + entry.unitName) + ' · ' + nf(entry.grams, 1) + ' g</div>' +
        '<div class="nutri-grid" style="margin-top:14px">' +
          '<div><b>' + nf(entry.kcal) + '</b><span>kcal</span></div>' +
          '<div><b>' + nf(entry.prot, 1) + '</b><span>Proteínas</span></div>' +
          '<div><b>' + nf(entry.carb, 1) + '</b><span>Hidratos</span></div>' +
          '<div><b>' + nf(entry.fat, 1) + '</b><span>Grasas</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="list">' +
        rowLink({ title: 'Editar cantidad o ingesta', ico: 'pencil', color: '--blue', attrs: 'data-eo="edit"' }) +
        rowLink({ title: 'Duplicar registro', ico: 'copy', color: '--green', attrs: 'data-eo="dup"' }) +
      '</div>' +
      '<button type="button" class="btn danger full" style="margin-top:20px" data-eo="del">Eliminar registro</button>' +
      '</div>';


    const h = Sheet.open({ title: 'Registro', left: 'Cerrar', body: body });
    h.el.addEventListener('click', function (e) {
      const b = e.target.closest('[data-eo]');
      if (!b) return;
      const a = b.getAttribute('data-eo');
      if (a === 'edit') {
        const food = FoodIndex.get(entry.foodId);
        h.close(null);
        if (!food) {
          Dialog.alert('Alimento no disponible', 'El alimento original ya no existe. Elimina el registro y vuelve a añadirlo.');
          return;
        }
        FoodFlow.quantity(food, key, mealId, Object.assign({}, entry, { mealId: mealId }));
        return;
      }
      if (a === 'dup') {
        State.update(function () {
          State.ensureDay(key).meals[mealId].push(Object.assign({}, entry, { id: uid('e') }));
        }, ['meal', 'day']);
        h.close(true);
        Toast.show('Registro duplicado', 'check');
        return;
      }
      if (a === 'del') {
        Dialog.confirm('Eliminar registro', 'Se eliminará "' + entry.name + '" de esta ingesta.', 'Eliminar', true).then(function (ok) {
          if (!ok) return;
          // Se guarda también la posición para que al deshacer vuelva a su
          // sitio en la lista y no al final.
          let pos = -1;
          const copy = JSON.parse(JSON.stringify(entry));
          State.update(function () {
            const arr = State.ensureDay(key).meals[mealId];
            pos = arr.findIndex(function (x) { return x.id === entry.id; });
            if (pos >= 0) arr.splice(pos, 1);
            State.pruneDay(key);
          }, ['meal', 'day']);
          h.close(true);
          Toast.undo('"' + copy.name + '" eliminado', function () {
            State.update(function () {
              const arr = State.ensureDay(key).meals[mealId];
              if (pos >= 0 && pos <= arr.length) arr.splice(pos, 0, copy); else arr.push(copy);
            }, ['meal', 'day']);
            Toast.show('Registro restaurado', 'check');
          });
        });
      }
    });
  },

/** Barras de macronutrientes con gramos, objetivo y porcentaje calórico. */
function macroBlock(t, g) {
  const rows = [
    { n: 'Proteínas', v: t.prot, g: g.prot, k: 4, c: '--red' },
    { n: 'Hidratos', v: t.carb, g: g.carb, k: 4, c: '--orange' },
    { n: 'Grasas', v: t.fat, g: g.fat, k: 9, c: '--yellow' }
  ];
  return rows.map(function (r) {
    const pctKcal = t.kcal > 0 ? Math.round(r.v * r.k / t.kcal * 100) : 0;
    return '<div class="macro">' +
      '<div class="macro-row"><span class="mn">' + r.n + ' · ' + pctKcal + ' % de las kcal</span>' +
      '<span>' + nf(r.v, 0) + ' / ' + nf(r.g, 0) + ' g</span></div>' +
      bar(r.g ? r.v / r.g * 100 : 0, r.c, true) + '</div>';
  }).join('');
}

  /* --- Sueño ------------------------------------------------------------- */
  renderSleep: function () {
    const g = State.data.goals;
    const nights = rangeKeys(todayKey(), 14).map(function (k) {
      return { key: k, label: DIAS_C[dateOf(k).getDay()], sleep: State.day(k).sleep };
    });
    const withSleep = nights.filter(function (n) { return n.sleep; });
    const last = State.day(todayKey()).sleep;


    let html = '<div class="block-tight"><div class="card">';
    if (last) {
      const dur = Domain.sleepMinutes(last.bed, last.wake);
      html += '<div class="card-head"><span class="card-title"><i class="dot" style="background:var(--c-sleep)"></i>Anoche</span>' +
        '<span class="card-note">' + minutesToClock(last.bed) + ' – ' + minutesToClock(last.wake) + '</span></div>' +
        '<div class="kcal-hero" style="padding:4px 0 14px"><div class="kh-num">' + minutesToHM(dur) + '</div>' +
        '<div class="kh-lab">objetivo ' + minutesToHM(g.sleep) + '</div></div>' +
        bar(g.sleep ? dur / g.sleep * 100 : 0, '--c-sleep') +
        '<div class="stat-3" style="margin-top:16px">' +
          '<div><b>' + Domain.sleepEfficiency(last.bed, last.wake, last.awake) + ' %</b><span>Eficiencia</span></div>' +
          '<div><b>' + (last.awake || 0) + ' min</b><span>Despierto</span></div>' +
          '<div><b>' + (last.quality || 3) + ' / 5</b><span>Calidad</span></div>' +
        '</div>' +
        '<button type="button" class="btn tinted full" style="margin-top:16px" data-act="edit-sleep">Editar registro</button>';
    } else {
      html += emptyState('moon', 'Sin registro de anoche',
        'Anota a qué hora te acostaste y te levantaste para ver tu descanso y su regularidad.', 'Registrar sueño', 'data-act="edit-sleep"');
    }
    html += '</div></div>';


    /* Gráfico de franjas */
    html += '<div class="section-header">Últimas dos semanas</div><div class="block-tight"><div class="card">';
    if (!withSleep.length) {
      html += emptyState('bars', 'Sin datos suficientes', 'Con dos o tres noches registradas ya podrás ver la regularidad de tu horario.');
    } else {
      html += '<p class="card-note" style="margin-bottom:10px">Cada franja muestra el intervalo real de sueño de esa noche sobre un eje horario.</p>' +
        Charts.sleep(nights);
    }
    html += '</div></div>';


    /* Estadísticas */
    if (withSleep.length >= 2) {
      const durs = withSleep.map(function (n) { return Domain.sleepMinutes(n.sleep.bed, n.sleep.wake); });
      const avgDur = sum(durs) / durs.length;
      // Las horas de acostarse se desplazan al eje 12:00-36:00 para poder
      // promediarlas sin que medianoche parta la serie en dos.
      const beds = withSleep.map(function (n) { return n.sleep.bed < 720 ? n.sleep.bed + 1440 : n.sleep.bed; });
      const avgBed = sum(beds) / beds.length;
      const wakes = withSleep.map(function (n) { return n.sleep.wake > 1080 ? n.sleep.wake - 1440 : n.sleep.wake; });
      const avgWake = sum(wakes) / wakes.length;
      const sd = Math.sqrt(sum(beds, function (b) { return (b - avgBed) * (b - avgBed); }) / beds.length);
      // Consistencia: 100 % con desviación nula, 0 % a partir de ±120 min.
      const consistency = clamp(Math.round((1 - sd / 120) * 100), 0, 100);


      html += '<div class="section-header">Estadísticas</div><div class="block-tight"><div class="list">' +
        '<div class="row"><span class="row-main"><span class="row-title">Duración media</span></span><span class="row-value">' + minutesToHM(avgDur) + '</span></div>' +
        '<div class="row"><span class="row-main"><span class="row-title">Hora media de acostarse</span></span><span class="row-value">' + minutesToClock(avgBed) + '</span></div>' +
        '<div class="row"><span class="row-main"><span class="row-title">Hora media de despertar</span></span><span class="row-value">' + minutesToClock(avgWake) + '</span></div>' +
        '<div class="row"><span class="row-main"><span class="row-title">Consistencia del horario</span>' +
        '<span class="row-sub">Desviación típica de ±' + nf(sd, 0) + ' min</span></span>' +
        '<span class="row-value">' + consistency + ' %</span></div>' +
        '<div class="row"><span class="row-main"><span class="row-title">Noches registradas</span></span><span class="row-value">' + withSleep.length + ' de 14</span></div>' +
        '</div></div>';


      html += '<div class="block"><div class="card">' +
        '<div class="card-head"><span class="card-title">Duración por noche</span><span class="card-note">Objetivo ' + minutesToHM(g.sleep) + '</span></div>' +
        Charts.bar({
          data: nights.map(function (n) {
            const v = n.sleep ? Domain.sleepMinutes(n.sleep.bed, n.sleep.wake) / 60 : 0;
            return { label: n.label, value: round(v, 2), dim: !n.sleep, tip: fmtDateShort(n.key) + ': ' + (n.sleep ? minutesToHM(v * 60) : 'sin registro') };
          }),
          goal: g.sleep / 60, goalLabel: 'Objetivo', color: '--c-sleep', height: 140, aria: 'Horas de sueño por noche'
        }) + '</div></div>';
    } else {
      html += '<div class="block"></div>';
    }
    return html;
  },

  mount: function (root) {

      const key = self.date;
      if (act === 'a-prev') { self.date = addDays(self.date, -1); Router.rerender(true); return; }
      if (act === 'a-next') { if (self.date >= todayKey()) return; self.date = addDays(self.date, 1); Router.rerender(true); return; }
      if (act === 'a-today') { self.date = todayKey(); Router.rerender(true); return; }
      if (act === 'edit-steps') { Actions.steps(key); return; }
      if (act === 'routines') { RoutineFlow.browse(); return; }
      if (act === 'add-workout') { Actions.workout(key, null); return; }
      if (act === 'edit-workout') {
        const w = (State.day(key).workouts || []).filter(function (x) { return x.id === el.getAttribute('data-wid'); })[0];
        if (w) ViewActivity.workoutOptions(key, w);
        return;
      }
      if (act === 'edit-sleep') { Actions.sleep(todayKey()); return; }
      if (act === 'add-weight') { Actions.weight(null); return; }
      if (act === 'edit-weight') {
        const w = State.data.weights.filter(function (x) { return x.date === el.getAttribute('data-date'); })[0];
        if (w) ViewActivity.weightOptions(w);
        return;
      }
      if (act === 'w-add') {
        pulse(el);
        Actions.addWater(key, Number(el.getAttribute('data-ml')));
        Toast.show('Agua registrada', 'drop');
        return;
      }
      if (act === 'w-custom') { Actions.waterCustom(key, null); return; }
      if (act === 'w-undo') {
        const d = State.data.days[key];
        if (!d || !d.water || !d.water.length) { Toast.show('No hay registros que deshacer'); return; }
        State.update(function (s) { s.days[key].water.pop(); State.pruneDay(key); }, ['water', 'day']);
        Toast.show('Registro eliminado', 'check');
        return;
      }
      if (act === 'w-del') {
        const idx = Number(el.getAttribute('data-widx'));
        State.update(function (s) {
          const d = s.days[key];
          if (d && d.water && d.water[idx]) d.water.splice(idx, 1);
          State.pruneDay(key);
        }, ['water', 'day']);
        Toast.show('Registro eliminado', 'check');
        return;

    });

/** Proyección lineal hacia el peso objetivo según el ritmo de las últimas 4 semanas. */
function weightProjection() {
  const ws = State.data.weights;
  const goal = State.data.goals.weight;
  if (ws.length < 3 || !goal) return null;
  const cut = addDays(todayKey(), -28);
  const recent = ws.filter(function (w) { return w.date >= cut; });
  const use = recent.length >= 3 ? recent : ws.slice(-6);
  if (use.length < 3) return null;
  const first = use[0], last = use[use.length - 1];
  const days = daysBetween(first.date, last.date);
  if (days < 5) return null;
  const perDay = (last.kg - first.kg) / days;
  if (Math.abs(perDay) < 0.002) return null;
  const need = goal - last.kg;
  if (need === 0) return null;
  if ((need > 0) !== (perDay > 0)) return null;   // el ritmo se aleja del objetivo
  const daysLeft = Math.round(need / perDay);
  if (daysLeft <= 0 || daysLeft > 1095) return null;
  const d = dateOf(addDays(todayKey(), daysLeft));
  return {
    perWeek: perDay * 7,
    dateLabel: d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear()
  };
}
