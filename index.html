/** Compara el periodo actual con el inmediatamente anterior de igual longitud.
    Devuelve cadena vacía si no hay suficiente historial: es preferible no
    enseñar nada a enseñar una variación calculada sobre dos días sueltos. */
function weekCompare(n) {
  const cur = rangeKeys(todayKey(), n);
  const prev = rangeKeys(addDays(todayKey(), -n), n);


  const metrics = [
    { n: 'Calorías', c: '--c-nutri',
      f: function (k) { return dayTotals(k).kcal; }, fmt: function (v) { return nf(v) + ' kcal'; } },
    { n: 'Pasos', c: '--c-act',
      f: function (k) { return State.day(k).steps || 0; }, fmt: function (v) { return nf(v); } },
    { n: 'Agua', c: '--c-water',
      f: function (k) { return waterTotal(k); }, fmt: function (v) { return Units.volume(Math.round(v)); } },
    { n: 'Sueño', c: '--c-sleep',
      f: function (k) { const sl = State.day(k).sleep; return sl ? Domain.sleepMinutes(sl.bed, sl.wake) : 0; },
      fmt: function (v) { return minutesToHM(Math.round(v)); } }
  ];


  const rows = metrics.map(function (m) {
    const cv = cur.filter(function (k) { return m.f(k) > 0; });
    const pv = prev.filter(function (k) { return m.f(k) > 0; });
    if (cv.length < 2 || pv.length < 2) return null;
    const a = sum(cv, m.f) / cv.length;
    const b = sum(pv, m.f) / pv.length;
    if (!b) return null;
    return { m: m, a: a, delta: (a - b) / b * 100 };
  }).filter(Boolean);


  if (!rows.length) return '';


  return '<div class="section-header">Frente al periodo anterior</div>' +
    '<div class="block-tight"><div class="card"><div class="cmp">' +
    rows.map(function (r) {
      const up = r.delta >= 0;
      const flat = Math.abs(r.delta) < 2;
      const cls = flat ? 'flat' : (up ? 'up' : 'down');
      const arrow = flat ? '' : icon(up ? 'up' : 'down', 12, { w: 3 });
      return '<div class="cmp-row">' +
        '<span class="cmp-dot" style="background:var(' + r.m.c + ')"></span>' +
        '<span class="cmp-name">' + esc(r.m.n) + '</span>' +
        '<span class="cmp-val">' + r.m.fmt(r.a) + '</span>' +
        '<span class="cmp-delta ' + cls + '">' + arrow +
          (flat ? 'igual' : (up ? '+' : '−') + nf(Math.abs(round(r.delta, 0))) + ' %') + '</span>' +
        '</div>';
    }).join('') +
    '</div><p class="card-note" style="margin-top:12px">Media diaria de los últimos ' + n +
    ' días frente a los ' + n + ' anteriores, contando solo los días con registro.</p></div></div>';
}


/* --- Conclusiones deterministas ------------------------------------------
   Todas se calculan sobre los datos reales del usuario. Si no hay muestra
   suficiente, la conclusión sencillamente no aparece.
   ------------------------------------------------------------------------ */
function buildInsights(keys) {
  const g = State.data.goals;
  const out = [];


  /* 1. Cumplimiento del objetivo de pasos */
  const stepDays = keys.filter(function (k) { return (State.day(k).steps || 0) > 0; });
  if (stepDays.length >= 4) {
    const ok = stepDays.filter(function (k) { return (State.day(k).steps || 0) >= g.steps; }).length;
    const pct = Math.round(ok / stepDays.length * 100);
    out.push({
      ico: 'shoe', color: '--c-act',
      title: 'Objetivo de pasos: ' + pct + ' % de los días',
      text: 'Lo has cumplido ' + ok + ' de los ' + stepDays.length + ' días con registro' +
        (pct >= 70 ? '. Ritmo sólido.' : (pct >= 40 ? '. Hay margen de mejora.' : '. Por debajo de lo habitual.'))
    });
  }


  /* 2. Media calórica frente al objetivo */
  const kcalDays = keys.filter(function (k) { return dayTotals(k).kcal > 0; });
  if (kcalDays.length >= 4) {
    const avg = sum(kcalDays, function (k) { return dayTotals(k).kcal; }) / kcalDays.length;
    const diff = avg - g.kcal;
    out.push({
      ico: 'flame', color: '--c-nutri',
      title: 'Media de ' + nf(avg) + ' kcal al día',
      text: Math.abs(diff) < g.kcal * 0.05
        ? 'Prácticamente en tu objetivo de ' + nf(g.kcal) + ' kcal.'
        : (diff > 0 ? nf(diff) + ' kcal por encima del objetivo, de media.' : nf(-diff) + ' kcal por debajo del objetivo, de media.')
    });
  }


  /* 3. Mejor y peor día de la semana para dormir */
  const byDow = [[], [], [], [], [], [], []];
  keys.forEach(function (k) {
    const s = State.day(k).sleep;
    if (s) byDow[dateOf(k).getDay()].push(Domain.sleepMinutes(s.bed, s.wake));
  });
  const dowAvg = byDow.map(function (arr, i) {
    return arr.length ? { dow: i, avg: sum(arr) / arr.length } : null;
  }).filter(Boolean);
  if (dowAvg.length >= 3) {
    const best = dowAvg.slice().sort(function (a, b) { return b.avg - a.avg; })[0];
    const worst = dowAvg.slice().sort(function (a, b) { return a.avg - b.avg; })[0];
    if (best.dow !== worst.dow) {
      out.push({
        ico: 'moon', color: '--c-sleep',
        title: 'Duermes más los ' + DIAS[best.dow] + 's',
        text: 'Media de ' + minutesToHM(best.avg) + ' los ' + DIAS[best.dow] + 's frente a ' +
          minutesToHM(worst.avg) + ' los ' + DIAS[worst.dow] + 's.'
      });
    }
  }


  /* 4. Relación aparente entre sueño y pasos */
  const xs = [], ys = [];
  keys.forEach(function (k) {
    const s = State.day(k).sleep;
    const st = State.day(k).steps || 0;
    xs.push(s ? Domain.sleepMinutes(s.bed, s.wake) : null);
    ys.push(st > 0 ? st : null);
  });
  const r = Domain.correlation(xs, ys);
  if (r != null && Math.abs(r) >= 0.35) {
    out.push({
      ico: 'sparkle', color: '--purple',
      title: r > 0 ? 'Más sueño, más pasos' : 'Más sueño, menos pasos',
      text: 'En este periodo hay una relación ' + (Math.abs(r) > 0.6 ? 'clara' : 'moderada') +
        ' (r = ' + nf(r, 2) + ') entre las horas dormidas y los pasos del día. Es una asociación, no una causa.'
    });
  }


  /* 5. Hidratación */
  const waterDays = keys.filter(function (k) { return waterTotal(k) > 0; });
  if (waterDays.length >= 4) {
    const ok = waterDays.filter(function (k) { return waterTotal(k) >= g.water; }).length;
    out.push({
      ico: 'drop', color: '--c-water',
      title: 'Objetivo de agua: ' + Math.round(ok / waterDays.length * 100) + ' % de los días',
      text: 'Media de ' + Units.volume(sum(waterDays, function (k) { return waterTotal(k); }) / waterDays.length) +
        ' al día en los días con registro.'
    });
  }


  /* 6. Tendencia del peso */
  const ws = State.data.weights.filter(function (w) { return w.date >= keys[0]; });
  if (ws.length >= 3) {
    const days = daysBetween(ws[0].date, ws[ws.length - 1].date);
    if (days >= 7) {
      const perWeek = (ws[ws.length - 1].kg - ws[0].kg) / days * 7;
      const weeks = Math.round(days / 7);
      out.push({
        ico: 'scale', color: '--c-weight',
        title: Math.abs(perWeek) < 0.05 ? 'Peso estable' : (perWeek < 0 ? 'Tendencia a la baja' : 'Tendencia al alza'),
        text: Math.abs(perWeek) < 0.05
          ? 'Sin variación relevante en las últimas ' + weeks + ' semanas.'
          : Units.weight(Math.abs(perWeek)) + ' por semana de media en las últimas ' + weeks + ' semanas.'
      });
    }
  }


  return out;
}

/* Cuando cambia algo que altera el gasto energético (peso, altura, edad, sexo,
   nivel de actividad o propósito), los objetivos calculados dejan de encajar.
   En lugar de pisarlos en silencio o dejarlos obsoletos, se ofrece actualizar
   solo si la diferencia es apreciable: quien haya fijado sus cifras a mano no
   quiere que se las cambien por un kilo arriba o abajo. */
const Profile = {
  suggestedGoals: function () {
    const p = State.data.profile;
    const kg = State.currentWeightKg();
    const bmr = Domain.bmr(p.sex, kg, p.height, Domain.ageFrom(p.birth));
    const tdee = Domain.tdee(bmr, p.activity);
    const t = Domain.targetKcal(tdee, p.purpose, p.sex);
    const pct = Domain.pctFromMacros(State.data.goals.kcal, State.data.goals);
    const m = Domain.macrosFromKcal(t.kcal, pct);
    return { kcal: t.kcal, prot: m.prot, carb: m.carb, fat: m.fat, water: Domain.waterSuggestion(kg) };
  },


  offerGoalRecalc: function () {
    const g = State.data.goals;
    const sug = Profile.suggestedGoals();
    const diff = Math.abs(sug.kcal - g.kcal);
    if (!isFinite(sug.kcal) || sug.kcal <= 0) return;
    if (diff < 40 || diff / Math.max(1, g.kcal) < 0.03) return;
    const dir = sug.kcal > g.kcal ? 'sube' : 'baja';
    Dialog.confirm(
      'Tu gasto estimado ha cambiado',
      'Con los datos nuevos, el objetivo calculado ' + dir + ' de ' + nf(g.kcal) + ' a ' + nf(sug.kcal) +
      ' kcal. ¿Quieres actualizar tus objetivos? Se mantiene tu reparto de macronutrientes.',
      'Actualizar objetivos'
    ).then(function (ok) {
      if (!ok) return;
      State.update(function (st) {
        st.goals.kcal = sug.kcal;
        st.goals.prot = sug.prot; st.goals.carb = sug.carb; st.goals.fat = sug.fat;
      }, ['goals']);
      Toast.show('Objetivos actualizados', 'check');
    });
  }
};

  mount: function (root) {
    delegate(root, 'click', 'data-theme-set', function (el) {
      selectOne($$('[data-theme-set]', root), el);
      State.update(function (s) { s.settings.theme = el.getAttribute('data-theme-set'); }, ['settings']);
      applyTheme();
    });
    delegate(root, 'click', 'data-accent-set', function (el) {
      pulse(el);
      selectOne($$('[data-accent-set]', root), el);
      State.update(function (s) { s.settings.accent = el.getAttribute('data-accent-set'); }, ['settings']);
      applyTheme();
    });
    delegate(root, 'click', 'data-units-set', function (el) {
      const v = el.getAttribute('data-units-set');
      State.update(function (s) { s.settings.units = v; }, ['settings']);
    });
    delegate(root, 'click', 'data-wdisp-set', function (el) {
      const v = el.getAttribute('data-wdisp-set');
      State.update(function (s) { s.settings.waterDisplay = v; }, ['settings']);
    });
    delegate(root, 'click', 'data-toggle', function (el) {
      const k = el.getAttribute('data-toggle');
      const now = el.getAttribute('aria-checked') !== 'true';
      el.setAttribute('aria-checked', String(now));
      State.update(function (s) { s.settings[k] = now; }, ['settings']);
    });
    delegate(root, 'click', 'data-set', function (el) {
      ViewSettings.action(el.getAttribute('data-set'));
    });
    Bus.on($('#importFile', root), 'change', function (e) {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (file) ViewSettings.importData(file);
    });
  },


  action: function (what) {
    const p = State.data.profile;
    const g = State.data.goals;
    const s = State.data.settings;


    switch (what) {
      case 'name':
        return textSheet('Nombre', 'Cómo quieres que te llame la app', p.name, 30, function (v) {
          State.update(function (st) { st.profile.name = v; }, ['profile']);
        });


      case 'sex':
        return choiceSheet('Sexo', SEXES, p.sex, function (v) {
          State.update(function (st) { st.profile.sex = v; }, ['profile', 'goals']);
          Profile.offerGoalRecalc();
        }, 'Se usa en la ecuación del metabolismo basal y en la estimación de la zancada.');


      case 'birth':
        return dateSheet('Fecha de nacimiento', p.birth, function (v) {
          State.update(function (st) { st.profile.birth = v; }, ['profile', 'goals']);
          Profile.offerGoalRecalc();
        });


      case 'height':
        return numSheet('Altura', Units.heightUnit(), Units.heightNum(p.height), Units.heightMin(), Units.heightMax(),
          Units.isImperial() ? 0.5 : 1, function (v) {
            State.update(function (st) { st.profile.height = Math.round(Units.heightToCm(v)); }, ['profile', 'goals']);
            Profile.offerGoalRecalc();
          });


      case 'weight':
        /* Antes esta fila solo tocaba profile.weight, pero todos los cálculos
           leen el pesaje más reciente: al existir cualquier registro, editar
           aquí no cambiaba nada. Ahora también anota el pesaje de hoy, que es
           lo que el usuario espera al escribir su peso actual. */
        return numSheet('Peso actual', Units.weightUnit(), Units.weightNum(State.currentWeightKg()),
          Units.weightMin(), Units.weightMax(), 0.1, function (v) {
            const kg = round(Units.weightToKg(v), 1);
            State.update(function (st) {
              st.profile.weight = kg;
              const date = todayKey();
              const rec = { date: date, kg: kg };
              const i = st.weights.findIndex(function (w) { return w.date === date; });
              if (i >= 0) st.weights[i] = rec; else st.weights.push(rec);
              st.weights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
            }, ['profile', 'weight', 'goals']);
            Profile.offerGoalRecalc();
          }, 'Queda anotado como el pesaje de hoy y actualiza el resto de cálculos.');


      case 'activity':
        return choiceSheet('Nivel de actividad', Domain.ACTIVITY_FACTORS.map(function (a) {
          return { id: a.id, n: a.n, sub: a.d + ' · factor ' + String(a.f).replace('.', ',') };
        }), p.activity, function (v) {
          State.update(function (st) { st.profile.activity = v; }, ['profile', 'goals']);
          Profile.offerGoalRecalc();
        });


      case 'purpose':
        return choiceSheet('Propósito', Domain.PURPOSES.map(function (x) {
          const pc = Math.round(Math.abs(x.adj) * 100);
          return { id: x.id, n: x.n, sub: x.adj === 0 ? 'Sin ajuste sobre el gasto total'
            : (x.adj < 0 ? 'Déficit del ' + pc + ' %' : 'Superávit del ' + pc + ' %') };
        }), p.purpose, function (v) {
          State.update(function (st) { st.profile.purpose = v; }, ['profile', 'goals']);
          Profile.offerGoalRecalc();
        });


      case 'kcal':
        return numSheet('Calorías diarias', 'kcal', g.kcal, 800, 6000, 10, function (v) {
          const keep = Domain.pctFromMacros(g.kcal, g);
          State.update(function (st) {
            st.goals.kcal = Math.round(v);
            const m = Domain.macrosFromKcal(st.goals.kcal, keep);
            st.goals.prot = m.prot; st.goals.carb = m.carb; st.goals.fat = m.fat;
          }, ['goals']);
        }, 'Al cambiar las calorías se recalculan los gramos de macronutrientes manteniendo tu reparto.');


      case 'macros': return ViewSettings.macrosSheet();


      case 'steps':
        return numSheet('Pasos diarios', 'pasos', g.steps, 1000, 40000, 500, function (v) {
          State.update(function (st) { st.goals.steps = Math.round(v); }, ['goals']);
        });


      case 'water':
        return numSheet('Agua diaria', Units.volumeUnit(), Units.volumeNum(g.water),
          Units.isImperial() ? 17 : 500, Units.isImperial() ? 169 : 5000, Units.isImperial() ? 1 : 50, function (v) {
            State.update(function (st) { st.goals.water = Math.round(Units.volumeToMl(v)); }, ['goals']);
          }, 'Referencia orientativa según tu peso: ' + Units.volume(Domain.waterSuggestion(State.currentWeightKg())) + ' al día.');


      case 'sleep':
        return numSheet('Horas de sueño', 'horas', round(g.sleep / 60, 1), 4, 12, 0.5, function (v) {
          State.update(function (st) { st.goals.sleep = Math.round(v * 60); }, ['goals']);
        });


      case 'wgoal':
        return numSheet('Peso objetivo', Units.weightUnit(), Units.weightNum(g.weight),
          Units.weightMin(), Units.weightMax(), 0.5, function (v) {
            State.update(function (st) { st.goals.weight = round(Units.weightToKg(v), 1); }, ['goals']);
          });


      case 'actmin':
        return numSheet('Actividad semanal', 'minutos', g.activityMin, 0, 1500, 15, function (v) {
          State.update(function (st) { st.goals.activityMin = Math.round(v); }, ['goals']);
        }, 'La Organización Mundial de la Salud recomienda al menos 150 minutos semanales de actividad moderada en adultos.');


      case 'glass':
        return numSheet('Tamaño del vaso', Units.volumeUnit(), Units.volumeNum(s.glass),
          Units.isImperial() ? 3 : 100, Units.isImperial() ? 34 : 1000, Units.isImperial() ? 1 : 10, function (v) {
            State.update(function (st) { st.settings.glass = Math.round(Units.volumeToMl(v)); }, ['settings']);
          });


      case 'auto': return ViewSettings.autoSheet();
      case 'cloud-setup': return CloudUI.setup();
      case 'cloud-login': return CloudUI.login();
      case 'cloud-sync': return CloudUI.sync();
      case 'cloud-logout': return CloudUI.logout();
      case 'cloud-wipe': return CloudUI.wipe();
      case 'export': return ViewSettings.exportData();
      case 'csv': return ViewSettings.exportCsv();
      case 'import': {
        const inp = $('#importFile');
        if (inp) inp.click();
        return;
      }
      case 'wipe': return ViewSettings.wipe();
      case 'onboard':
        return Dialog.confirm('Repetir la bienvenida', 'Se abrirá de nuevo la secuencia inicial. Tus datos no se borran.', 'Empezar')
          .then(function (ok) { if (ok) Onboarding.start(); });
    }
  },


  macrosSheet: function () {
    const g = State.data.goals;
    const pct = Domain.pctFromMacros(g.kcal, g);
    const rows = [['prot', 'Proteínas'], ['carb', 'Hidratos'], ['fat', 'Grasas']];
    const body = '<div class="block" style="padding-top:0">' +
      '<p class="hint" style="margin-bottom:16px">Reparto calórico sobre ' + nf(g.kcal) + ' kcal. Los tres porcentajes deben sumar 100 %.</p>' +
      rows.map(function (r) {
        return '<div style="margin-bottom:18px">' +
          '<div class="macro-row"><span class="mn">' + r[1] + '</span><span id="mg_' + r[0] + '">—</span></div>' +
          '<div style="display:flex;align-items:center;gap:12px">' +
            '<input class="slider" type="range" id="ms_' + r[0] + '" min="0" max="100" step="1" value="' + pct[r[0]] +
            '" aria-label="Porcentaje de ' + r[1] + '">' +
            '<span style="width:48px;text-align:right" id="mp_' + r[0] + '">' + pct[r[0]] + ' %</span>' +
          '</div></div>';
      }).join('') +
      '<div class="card"><div class="kv"><span class="k">Total</span><span class="v" id="mTotal">—</span></div></div>' +
      '<p class="field-error" id="mErr" hidden></p>' +
      '<div class="grid-3" style="margin-top:16px">' +
        '<button type="button" class="btn" data-preset="25,45,30">Equilibrado</button>' +
        '<button type="button" class="btn" data-preset="35,35,30">Proteico</button>' +
        '<button type="button" class="btn" data-preset="25,20,55">Bajo en HC</button>' +
      '</div></div>';


    const h = Sheet.open({
      title: 'Macronutrientes', right: 'Guardar', body: body,
      onMount: function (hh) { refresh(hh); },
      onConfirm: function (hh) {
        const v = read(hh);
        const err = $('#mErr', hh.el);
        if (v.prot + v.carb + v.fat !== 100) {
          err.hidden = false;
          err.textContent = 'Los porcentajes suman ' + (v.prot + v.carb + v.fat) + ' %. Deben sumar exactamente 100 %.';
          return;
        }
        const m = Domain.macrosFromKcal(g.kcal, v);
        State.update(function (st) { st.goals.prot = m.prot; st.goals.carb = m.carb; st.goals.fat = m.fat; }, ['goals']);
        hh.close(true);
        Toast.show('Macronutrientes guardados', 'check');
      }
    });


    function read(hh) {
      return {
        prot: Number($('#ms_prot', hh.el).value),
        carb: Number($('#ms_carb', hh.el).value),
        fat: Number($('#ms_fat', hh.el).value)
      };
    }
    function refresh(hh) {
      if (hh.closed) return;
      const v = read(hh);
      const m = Domain.macrosFromKcal(g.kcal, v);
      rows.forEach(function (r) {
        $('#mp_' + r[0], hh.el).textContent = v[r[0]] + ' %';
        $('#mg_' + r[0], hh.el).textContent = nf(m[r[0]]) + ' g';
      });
      const tot = v.prot + v.carb + v.fat;
      const el = $('#mTotal', hh.el);
      el.textContent = tot + ' %';
      el.style.color = tot === 100 ? 'var(--green-txt)' : 'var(--orange-txt)';
      $('#mErr', hh.el).hidden = true;
    }
    h.el.addEventListener('input', function () { refresh(h); });
    h.el.addEventListener('click', function (e) {
      const b = e.target.closest('[data-preset]');
      if (!b) return;
      const p = b.getAttribute('data-preset').split(',');
      $('#ms_prot', h.el).value = p[0]; $('#ms_carb', h.el).value = p[1]; $('#ms_fat', h.el).value = p[2];
      refresh(h);
    });
  },

  exportData: function () {
    try {
      State.saveNow();
      const payload = JSON.stringify({
        app: APP_NAME, version: APP_VERSION, schema: SCHEMA_VERSION,
        exported: new Date().toISOString(), data: State.data
      }, null, 2);
      const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'brio-' + todayKey() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      Toast.show('Copia exportada', 'check');
    } catch (e) {
      Dialog.alert('No se ha podido exportar',
        'Este navegador ha bloqueado la descarga del archivo. Prueba desde otro navegador o revisa sus restricciones de descarga.');
    }
  },


  /* El JSON sirve para restaurar la app; el CSV, para abrir los datos en una
     hoja de cálculo. Se usa punto y coma y coma decimal porque es lo que
     espera Excel en configuración española. */
  exportCsv: function () {
    try {
      State.saveNow();
      const keys = Object.keys(State.data.days).sort();
      const dec = function (v) { return String(v == null ? '' : v).replace('.', ','); };
      const cell = function (v) {
        const t = String(v == null ? '' : v);
        return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
      };
      const head = ['Fecha', 'Kcal', 'Proteinas_g', 'Hidratos_g', 'Grasas_g', 'Fibra_g',
                    'Agua_ml', 'Pasos', 'Ejercicio_min', 'Ejercicio_kcal',
                    'Sueno_min', 'Peso_kg', 'Nota'];
      const rows = keys.map(function (k) {
        const d = State.day(k);
        const t = dayTotals(k);
        const wg = State.data.weights.filter(function (w) { return w.date === k; })[0];
        return [
          k, Math.round(t.kcal), dec(round(t.prot, 1)), dec(round(t.carb, 1)),
          dec(round(t.fat, 1)), dec(round(t.fib, 1)),
          waterTotal(k), d.steps || 0, workoutMinTotal(k), workoutKcalTotal(k),
          d.sleep ? Domain.sleepMinutes(d.sleep.bed, d.sleep.wake) : '',
          wg ? dec(wg.kg) : '',
          // Los saltos de línea romperían la fila del CSV.
          (d.note || '').replace(/[\r\n]+/g, ' ')
        ].map(cell).join(';');
      });
      if (!rows.length) {
        Dialog.alert('Todavía no hay nada que exportar',
          'Registra al menos un día para poder generar la hoja de cálculo.');
        return;
      }
      // La marca BOM hace que Excel reconozca los acentos.
      const payload = '\ufeff' + head.join(';') + '\n' + rows.join('\n');
      const url = URL.createObjectURL(new Blob([payload], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'brio-' + todayKey() + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      Toast.show('Hoja de cálculo exportada', 'check');
    } catch (e) {
      Dialog.alert('No se ha podido exportar',
        'Este navegador ha bloqueado la descarga del archivo. Prueba desde otro navegador o revisa sus restricciones de descarga.');
    }
  },


  importData: function (file) {
    const reader = new FileReader();
    reader.onerror = function () {
      Dialog.alert('No se ha podido leer el archivo', 'Comprueba que el archivo existe y vuelve a intentarlo.');
    };
    reader.onload = function () {
      let parsed;
      try { parsed = JSON.parse(String(reader.result)); }
      catch (e) {
        Dialog.alert('El archivo no es JSON válido', 'Selecciona el archivo brio-AAAA-MM-DD.json que generaste al exportar.');
        return;
      }
      const data = parsed && parsed.data ? parsed.data : parsed;
      const problem = validateImport(data);
      if (problem) {
        Dialog.alert('El archivo no tiene el formato esperado', problem);
        return;
      }
      Dialog.confirm('Importar datos', 'Se sustituirán todos los datos actuales por los del archivo. Esta acción no se puede deshacer.', 'Importar', true)
        .then(function (ok) {
          if (!ok) return;
          State.data = migrate(data);
          invalidateTotals();
          State.saveNow();
          FoodIndex.rebuild();
          applyTheme();
          Router.rerender(true);
          Toast.show('Datos importados', 'check');
        });
    };
    reader.readAsText(file);
  },


  wipe: function () {
    Dialog.confirm('Borrar todos los datos', 'Se eliminarán registros, objetivos, alimentos propios y recetas.', 'Continuar', true)
      .then(function (ok) {
        if (!ok) return null;
        return Dialog.confirm('Confirmación final', 'Esta acción es irreversible. ¿Seguro que quieres borrarlo todo?', 'Borrar todo', true);
      })
      .then(function (ok2) {
        if (!ok2) return;
        Store.clear();
        State.data = defaultState();
        invalidateTotals();
        State.saveNow();
        FoodIndex.rebuild();
        applyTheme();
        Toast.show('Datos borrados', 'check');
        Onboarding.start();
      });
  }
};


/** Comprueba que el objeto importado tiene la forma mínima esperada. */
function validateImport(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return 'El contenido no es un objeto de datos de ' + APP_NAME + '.';
  if (!d.profile || typeof d.profile !== 'object') return 'Falta el bloque de perfil.';
  if (!d.goals || typeof d.goals !== 'object') return 'Falta el bloque de objetivos.';
  if (d.days != null && (typeof d.days !== 'object' || Array.isArray(d.days))) return 'El bloque de días tiene un formato incorrecto.';
  if (d.weights != null && !Array.isArray(d.weights)) return 'El historial de peso debe ser una lista.';
  if (d.customFoods != null && !Array.isArray(d.customFoods)) return 'La lista de alimentos propios tiene un formato incorrecto.';
  const kcal = Number(d.goals.kcal);
  if (!isFinite(kcal) || kcal <= 0) return 'El objetivo de calorías no es un número válido.';
  return null;
}

function numSheet(title, unit, value, min, max, step, onSave, hint) {
  Sheet.open({
    title: title, right: 'Guardar', focus: true,
    body: '<div class="block" style="padding-top:0"><label class="label" for="nsV">' + esc(unit) + '</label>' +

      const v = parseNum(inp.value);

        inp.classList.add('invalid');

      }
      onSave(v);
      h.close(true);
      Toast.show('Guardado', 'check');

function dateSheet(title, value, onSave) {
  Sheet.open({
    title: title, right: 'Guardar',
    body: '<div class="block" style="padding-top:0"><label class="label" for="dsV">Fecha</label>' +
      '<input class="field" id="dsV" type="date" value="' + esc(value || '1995-01-01') + '" max="' + todayKey() + '">' +

      const v = $('#dsV', h.el).value;

        err.hidden = false; err.textContent = 'Introduce una fecha con el formato AAAA-MM-DD.';
        return;
      }
      const age = Domain.ageFrom(v);
      if (v > todayKey() || age < 10 || age > 110) {
        err.hidden = false; err.textContent = 'La fecha debe corresponder a una edad entre 10 y 110 años.';
        return;
      }
      onSave(v);
      h.close(true);
      Toast.show('Guardado', 'check');
    }
  });

/* ==========================================================================
   TEMA
   ========================================================================== */
function prefersDark() {
  try {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  } catch (e) { return false; }
}


function applyTheme() {
  const s = (State.data && State.data.settings) || { theme: 'auto', accent: 'green' };
  const resolved = s.theme === 'auto' ? (prefersDark() ? 'dark' : 'light') : s.theme;
  const root = document.documentElement;
  root.setAttribute('data-theme', resolved);
  root.setAttribute('data-accent', s.accent || 'green');
}


/* ==========================================================================
   ENRUTADOR Y BARRA DE PESTAÑAS
   ========================================================================== */
const TABS = [
  { id: 'hoy',        n: 'Hoy',        ico: 'home' },
  { id: 'comida',     n: 'Comida',     ico: 'bowl' },
  { id: 'actividad',  n: 'Actividad',  ico: 'flame' },
  { id: 'tendencias', n: 'Tendencias', ico: 'bars' },
  { id: 'ajustes',    n: 'Ajustes',    ico: 'gear' }
];


const Router = {
  current: 'hoy',
  views: {},


  /** Repinta Ajustes cuando cambia el estado de la nube, y solo si es la vista
      visible: sincronizar desde otra pestaña no debe provocar un repintado. */
  refreshCloud: function () {
    if (this.current === 'ajustes') this.rerender(false);
  },


  init: function () {
    this.views = {
      hoy: ViewToday,
      comida: ViewFood,
      actividad: ViewActivity,
      tendencias: ViewTrends,
      ajustes: ViewSettings
    };
    const bar = $('#tabbar');
    bar.innerHTML = TABS.map(function (t) {
      return '<button type="button" class="tab" data-tab="' + t.id + '" aria-label="' + esc(t.n) + '">' +
        '<span class="tab-ico" data-ico="' + t.ico + '">' + icon(t.ico, 25, { w: 1.7 }) + '</span>' +
        '<span class="tab-label">' + esc(t.n) + '</span></button>';
    }).join('');
    bar.addEventListener('click', function (e) {
      const b = e.target.closest('[data-tab]');
      if (b) Router.go(b.getAttribute('data-tab'));
    });
    // La barra superior delega en el método de acción de la vista activa.
    $('#nav-right').addEventListener('click', function (e) {
      if (!e.target.closest('[data-navact]')) return;
      const view = Router.views[Router.current];
      if (view && view.navAction) view.navAction();
    });
  },


  syncTabs: function () {
    $$('#tabbar .tab').forEach(function (b) {
      const active = b.getAttribute('data-tab') === Router.current;
      if (active) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
      const ico = $('.tab-ico', b);
      ico.innerHTML = icon(ico.getAttribute('data-ico'), 25, { w: 1.7, fill: active });
    });
  },


  go: function (id) {
    if (!this.views[id] || this.current === id) {
      if (this.views[id]) this.render(true);
      return;
    }
    this.current = id;
    this.render(true);
  },


  rerender: function (resetScroll) { this.render(!!resetScroll); },


  render: function (resetScroll) {
    const view = this.views[this.current];
    const screen = $('#screen');
    if (!view || !screen) return;


    const prevScroll = screen.scrollTop;
    Bus.clear();
    try {
      screen.innerHTML = view.render();
    } catch (e) {
      screen.innerHTML = '<div class="block">' +
        emptyState('warn', 'No se ha podido dibujar la pantalla',
          'Vuelve a intentarlo. Si el problema persiste, exporta tus datos desde Ajustes.') + '</div>';
    }
    $('#navbar-title').textContent = view.title;
    screen.setAttribute('aria-label', view.title);
    $('#nav-right').innerHTML = view.navRight ? view.navRight() : '';
    this.syncTabs();


    try { if (view.mount) view.mount(screen); } catch (e) { /* la vista sigue siendo utilizable */ }


    Bus.on(screen, 'scroll', function () {
      $('#navbar').classList.toggle('scrolled', screen.scrollTop > 18);
    }, { passive: true });


    if (resetScroll) {
      screen.scrollTop = 0;
      $('#navbar').classList.remove('scrolled');
    } else {
      screen.scrollTop = prevScroll;
      $('#navbar').classList.toggle('scrolled', screen.scrollTop > 18);
    }
  }
};

const Onboarding = {

  bind: function () {
    const el = $('#onboarding');
    const self = this;
    el.onclick = function (e) {
      const nav = e.target.closest('[data-obnav]');
      if (nav) {
        const a = nav.getAttribute('data-obnav');
        if (a === 'skip') { self.finish(false); return; }
        if (a === 'back') { self.step = Math.max(0, self.step - 1); self.render(); return; }
        if (!self.collect()) return;
        if (self.step === 4) { self.finish(true); return; }
        self.step++;
        self.render();
        return;
      }
      const sx = e.target.closest('[data-obsex]');
      if (sx) { self.draft.sex = sx.getAttribute('data-obsex'); selectOne($$('[data-obsex]', el), sx); return; }
      const ac = e.target.closest('[data-obact]');
      if (ac) { self.draft.activity = ac.getAttribute('data-obact'); self.render(); return; }
      const pu = e.target.closest('[data-obpur]');
      if (pu) {
        self.draft.purpose = pu.getAttribute('data-obpur');
        self.draft.weightGoal = null;      // el objetivo de peso se recalcula
        selectOne($$('[data-obpur]', el), pu);
        return;
      }
      const ed = e.target.closest('[data-obedit]');
      if (ed) {
        const k = ed.getAttribute('data-obedit');
        const cfg = {
          kcal: ['Calorías diarias', 'kcal', 800, 6000, 10],
          steps: ['Pasos diarios', 'pasos', 1000, 40000, 500],
          water: ['Agua diaria', 'ml', 500, 5000, 50],
          sleep: ['Horas de sueño', 'horas', 4, 12, 0.5],
          weightGoal: ['Peso objetivo', 'kg', 20, 400, 0.5]
        }[k];
        const cur = k === 'sleep' ? round(self.draft.sleep / 60, 1) : self.draft[k];
        numSheet(cfg[0], cfg[1], cur, cfg[2], cfg[3], cfg[4], function (v) {
          if (k === 'sleep') self.draft.sleep = Math.round(v * 60);
          else if (k === 'weightGoal') self.draft.weightGoal = round(v, 1);
          else self.draft[k] = Math.round(v);
          if (k === 'kcal') {
            const m = Domain.macrosFromKcal(self.draft.kcal, { prot: 25, carb: 45, fat: 30 });
            self.draft.prot = m.prot; self.draft.carb = m.carb; self.draft.fat = m.fat;
          }
          self.render();
        });
      }
    };
  },


  /** Recoge y valida los campos del paso actual. Devuelve false si algo falla. */
  collect: function () {
    const el = $('#onboarding');
    const d = this.draft;
    if (this.step === 1) {
      d.name = ($('#obName', el).value || '').trim();
      const b = $('#obBirth', el).value;
      const err = $('#obErr1', el);
      if (!b || !/^\d{4}-\d{2}-\d{2}$/.test(b) || b > todayKey()) {
        err.hidden = false; err.textContent = 'Introduce una fecha de nacimiento válida.';
        return false;
      }
      const age = Domain.ageFrom(b);
      if (age < 10 || age > 110) {
        err.hidden = false; err.textContent = 'La fecha debe corresponder a una edad entre 10 y 110 años.';
        return false;
      }
      d.birth = b;
      return true;
    }
    if (this.step === 2) {
      const h = parseNum($('#obH', el).value);
      const w = parseNum($('#obW', el).value);
      const err = $('#obErr2', el);
      if (isNaN(h) || h < 100 || h > 250) {
        err.hidden = false; err.textContent = 'La altura debe estar entre 100 y 250 cm.';
        return false;
      }
      if (isNaN(w) || w < 20 || w > 400) {
        err.hidden = false; err.textContent = 'El peso debe estar entre 20 y 400 kg.';
        return false;
      }
      d.height = Math.round(h);
      d.weight = round(w, 1);
      d.water = null;                      // se recalcula con el peso nuevo
      d.weightGoal = null;
      return true;
    }
    return true;
  }
};


/* ==========================================================================
   ARRANQUE
   ========================================================================== */
(function boot() {
  function init() {
    State.load();
    applyTheme();
    FoodIndex.rebuild();


    /* La nube es opcional: si nunca se ha configurado, nada de esto se activa
       y la aplicación se comporta igual que siempre. */
    let backFromProvider = false;
    try {
      Cloud.load();
      if (Cloud.configured()) backFromProvider = Cloud.captureOAuthRedirect();
    } catch (e) { /* una configuración corrupta no debe impedir arrancar */ }


    Router.init();


    // Cualquier mutación del estado repinta la vista activa, salvo que esta
    // sepa aplicar una actualización puntual más barata.
    State.subscribe(function (tags) {
      const view = Router.views[Router.current];
      if (view && view.patch && view.patch(tags)) return;
      Router.rerender(false);
    });


    Router.render(true);


    if (!State.data.onboarded && !backFromProvider) Onboarding.start();


    /* Al volver del proveedor o al abrir con sesión ya iniciada, se sincroniza
       en segundo plano. Un fallo aquí se refleja en Ajustes, sin interrumpir. */
    if (Cloud.signedIn()) {
      setTimeout(function () {
        Cloud.sync().then(function () {
          if (backFromProvider) Toast.show('Sesión iniciada y datos sincronizados', 'check');
        }).catch(function () { /* el estado queda visible en Ajustes */ });
      }, backFromProvider ? 400 : 1200);
    }


    // Cambio de tema del sistema en modo automático
    try {
      if (window.matchMedia) {
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const onChange = function () { if (State.data.settings.theme === 'auto') applyTheme(); };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
        else if (mq.addListener) mq.addListener(onChange);
      }
    } catch (e) { /* sin soporte: se mantiene el tema resuelto al arrancar */ }


    // Cambio de día con la aplicación abierta
    let lastDay = todayKey();
    function checkDay() {
      const now = todayKey();
      if (now === lastDay) return;
      const prev = lastDay;
      lastDay = now;
      [ViewToday, ViewFood, ViewActivity].forEach(function (v) {
        if (v.date === prev) v.date = now;
      });
      Router.rerender(false);
    }
    setInterval(checkDay, 60000);


    // Guardado inmediato al salir o al pasar a segundo plano.
    window.addEventListener('beforeunload', function () { State.saveNow(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) State.saveNow();
      else checkDay();
    });
  }


  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();


</script>
</body>
