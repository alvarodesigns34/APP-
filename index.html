  /** Día indicado garantizando que existe y está completo. */
  ensureDay: function (key) {
    if (!this.data.days[key]) this.data.days[key] = emptyDay();
    const d = this.data.days[key];
    if (!d.meals) d.meals = {};
    MEALS.forEach(function (m) { if (!Array.isArray(d.meals[m.id])) d.meals[m.id] = []; });
    if (!Array.isArray(d.water)) d.water = [];
    if (!Array.isArray(d.workouts)) d.workouts = [];
    if (typeof d.steps !== 'number') d.steps = 0;
    return d;
  },


  /** Elimina días completamente vacíos para no inflar el almacenamiento. */
  pruneDay: function (key) {
    const d = this.data.days[key];
    if (!d) return;
    const empty = MEALS.every(function (m) { return !d.meals[m.id] || d.meals[m.id].length === 0; }) &&
      (!d.water || d.water.length === 0) && !d.steps &&
      (!d.workouts || d.workouts.length === 0) && !d.sleep &&
      !(d.note && d.note.trim());
    if (empty) delete this.data.days[key];
  },


  latestWeight: function (beforeKey) {
    const ws = this.data.weights.filter(function (w) { return !beforeKey || w.date <= beforeKey; });
    return ws.length ? ws[ws.length - 1] : null;
  },


  currentWeightKg: function () {
    const w = this.latestWeight();
    return w ? w.kg : this.data.profile.weight;
  }
};


/* --- Saneado de alimentos y recetas del usuario -------------------------- */
/** Número finito y no negativo, o el valor por defecto. */
function safeNum(v, def) {
  const n = Number(v);
  return isFinite(n) && n >= 0 ? n : def;
}
/** Número finito y no negativo, o null si no hay dato fiable. */
function safeOpt(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return isFinite(n) && n >= 0 ? n : null;
}
/** Lista de unidades normalizada; acepta tanto pares como objetos. */
function safeUnits(u) {
  if (!Array.isArray(u)) return [];
  return u.map(function (x) {
    if (Array.isArray(x) && x.length >= 2) return { name: String(x[0]), g: safeNum(x[1], 0) };
    if (x && typeof x === 'object' && x.name) return { name: String(x.name), g: safeNum(x.g, 0) };
    return null;
  }).filter(function (x) { return x && x.g > 0; });
}


function sanitizeCustomFood(f) {
  if (!f || typeof f !== 'object' || !f.id || !f.name) return null;
  return {
    id: String(f.id), name: String(f.name).slice(0, 80), cat: 'propio',
    kcal: safeNum(f.kcal, 0), prot: safeNum(f.prot, 0), carb: safeNum(f.carb, 0),
    fat: safeNum(f.fat, 0), fib: safeNum(f.fib, 0),
    sug: safeOpt(f.sug), sat: safeOpt(f.sat), sod: safeOpt(f.sod),
    units: safeUnits(f.units), base: f.base === 'ml' ? 'ml' : 'g', custom: true
  };
}


/** Una receta sin `per100` se reconstruye desde sus ingredientes; si tampoco
    se puede, se descarta en lugar de dejar un objeto a medias circulando. */
function sanitizeUserRecipe(r) {
  if (!r || typeof r !== 'object' || !r.id || !r.name) return null;
  const items = (Array.isArray(r.items) ? r.items : [])
    .map(function (i) {
      if (!i || typeof i !== 'object' || !i.foodId) return null;
      const g = safeNum(i.grams, 0);
      return g > 0 ? { foodId: String(i.foodId), grams: g } : null;
    })
    .filter(Boolean);
  const servings = clamp(Math.round(safeNum(r.servings, 1)) || 1, 1, 30);


  let per100 = r.per100;
  const ok = per100 && typeof per100 === 'object' && isFinite(Number(per100.kcal));
  if (!ok) {
    // Reconstrucción a partir de los ingredientes que sigan existiendo.
    let totalG = 0;
    const acc = { kcal: 0, prot: 0, carb: 0, fat: 0, fib: 0 };
    items.forEach(function (i) {
      const f = FOOD_BY_ID[i.foodId];
      if (!f) return;
      const k = i.grams / 100;
      acc.kcal += f.kcal * k; acc.prot += f.prot * k; acc.carb += f.carb * k;
      acc.fat += f.fat * k;  acc.fib += f.fib * k;
      totalG += i.grams;
    });
    if (!totalG) return null;
    per100 = {
      kcal: round(acc.kcal / totalG * 100, 1), prot: round(acc.prot / totalG * 100, 1),
      carb: round(acc.carb / totalG * 100, 1), fat: round(acc.fat / totalG * 100, 1),
      fib: round(acc.fib / totalG * 100, 1)
    };
  } else {
    per100 = {
      kcal: safeNum(per100.kcal, 0), prot: safeNum(per100.prot, 0), carb: safeNum(per100.carb, 0),
      fat: safeNum(per100.fat, 0), fib: safeNum(per100.fib, 0)
    };
  }


  const totalG = sum(items, function (i) { return i.grams; });
  const servingG = safeNum(r.servingG, 0) || (totalG ? round(totalG / servings, 1) : 0);
  if (!servingG) return null;
  return { id: String(r.id), name: String(r.name).slice(0, 80), items: items,
           servings: servings, servingG: servingG, per100: per100 };
}


/* ==========================================================================
   CAPA DE SINCRONIZACIÓN
   Prepara los datos para vivir en varios dispositivos a la vez. Todavía no
   habla con ningún servidor: lo que hace es dejar la estructura lista para
   que hacerlo después sea añadir transporte, no rehacer el modelo.


   Tres decisiones de fondo:


   1) Fusión por REGISTRO, no por documento. Si el móvil añade una cena y el
      portátil añade un desayuno del mismo día, quedarse con «el día más
      reciente» perdería una de las dos comidas. Cada entrada se compara por
      separado y gana la más reciente.


   2) Registro de bajas separado. Un registro borrado y uno que aún no ha
      llegado son indistinguibles si no se deja rastro: sin esto, cualquier
      borrado reaparecería en la siguiente sincronización. Las bajas viven en
      una lista aparte (`tomb`) para que ningún punto de lectura de la app
      tenga que cambiar.


   3) Marcado automático. En vez de tocar los quince sitios que mutan datos
      —con el riesgo de olvidar uno—, se compara el estado antes y después de
      cada cambio y se marca lo que se haya movido. Un olvido aquí sería un
      dato que no sincroniza jamás y nadie se daría cuenta.
   ========================================================================== */


/* Colecciones de registros identificables. Cada una declara cómo llegar a su
   array y cuál es el campo que hace de identificador. */
function eachCollection(st, fn) {
  Object.keys(st.days || {}).forEach(function (k) {
    const d = st.days[k];
    if (!d) return;
    MEALS.forEach(function (m) {
      if (Array.isArray(d.meals && d.meals[m.id])) fn('d/' + k + '/m/' + m.id, d.meals[m.id], 'id');
    });
    if (Array.isArray(d.water)) fn('d/' + k + '/w', d.water, 'id');
    if (Array.isArray(d.workouts)) fn('d/' + k + '/k', d.workouts, 'id');
  });
  if (Array.isArray(st.weights)) fn('wg', st.weights, 'date');
  if (Array.isArray(st.customFoods)) fn('cf', st.customFoods, 'id');
  if (Array.isArray(st.recipes)) fn('rc', st.recipes, 'id');
}


/* Campos sueltos que no son listas: se comparan uno a uno con su propia
   marca de tiempo, porque cambiar el peso objetivo no debería pisar un
   cambio de altura hecho en otro dispositivo diez minutos antes. */
const SCALAR_GROUPS = [
  { path: 'profile', keys: ['name', 'sex', 'birth', 'height', 'weight', 'activity', 'purpose'] },
  { path: 'settings', keys: ['theme', 'accent', 'units', 'glass', 'pantryBasics', 'waterDisplay', 'activityAdjust'] },
  { path: 'goals', keys: ['kcal', 'prot', 'carb', 'fat', 'steps', 'water', 'sleep', 'weight', 'activityMin'] },
  { path: 'root', keys: ['onboarded', 'favorites', 'favRecipes', 'pantry', 'recents'] }
];


const Sync = {
  /* Identificador de este dispositivo. Sirve para saber de dónde viene cada
     cambio cuando haya que depurar una fusión rara. */
  deviceId: null,


  lastTs: 0,


  /** Marca de tiempo estrictamente creciente dentro de la sesión: dos cambios
      en el mismo milisegundo tendrían el mismo sello y la fusión sería
      arbitraria entre ellos. */
  now: function () {
    let t = Date.now();
    if (t <= this.lastTs) t = this.lastTs + 1;
    this.lastTs = t;
    return t;
  },


  ensureDevice: function (st) {
    if (!st.deviceId) {
      st.deviceId = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    }
    this.deviceId = st.deviceId;
    return st.deviceId;
  },


  /** Fotografía del estado: para cada registro, su contenido serializado.
      Es lo que permite detectar altas, bajas y ediciones sin tocar el resto
      de la aplicación. */
  snapshot: function (st, index) {
    const out = {};
    eachCollection(st, function (path, arr, idKey) {
      for (let i = 0; i < arr.length; i++) {
        const r = arr[i];
        if (!r || r[idKey] == null) continue;
        const key = path + '#' + r[idKey];
        out[key] = stableJson(r);
        if (index) index[key] = r;
      }
    });
    // Escalares por día que no son listas.
    Object.keys(st.days || {}).forEach(function (k) {
      const d = st.days[k];
      if (!d) return;
      out['d/' + k + '@steps'] = String(d.steps || 0);
      out['d/' + k + '@sleep'] = d.sleep ? stableJson(d.sleep) : '';
      out['d/' + k + '@note'] = String(d.note || '');
    });
    SCALAR_GROUPS.forEach(function (g) {
      const src = g.path === 'root' ? st : st[g.path];
      if (!src) return;
      g.keys.forEach(function (key) {
        out[g.path + '@' + key] = stableJson(src[key]);
      });
    });
    return out;
  },


  /** Compara dos fotografías y sella lo que haya cambiado. Devuelve cuántos
      registros se han marcado, que es útil en las pruebas. */
  reconcile: function (st, before, after, index) {
    const ts = this.now();
    const dev = this.ensureDevice(st);
    let touched = 0;


    /* El índice es opcional: si no llega, se construye aquí. Sin esta red,
       llamar a reconcile sin índice no sellaría nada y lo haría en silencio,
       que es la peor forma de fallar en una capa de sincronización. */
    if (!index) {
      index = {};
      eachCollection(st, function (path, arr, idKey) {
        for (let i = 0; i < arr.length; i++) {
          const r = arr[i];
          if (r && r[idKey] != null) index[path + '#' + r[idKey]] = r;
        }
      });
    }


    /* Altas y ediciones: se recorren las claves de la fotografía nueva, que
       ya trae el registro localizado. Recorrer el estado entero otra vez
       costaba tanto como hacer la fotografía. */
    Object.keys(after).forEach(function (key) {
      if (key.indexOf('#') < 0) return;
      if (before[key] === after[key]) return;
      const r = index ? index[key] : null;
      if (r) { r.u = ts; r.dev = dev; touched++; }
    });


    // Bajas: el registro ya no está, así que el sello va al registro de bajas.
    st.tomb = Array.isArray(st.tomb) ? st.tomb : [];
    Object.keys(before).forEach(function (key) {
      if (key.indexOf('#') < 0) return;
      if (after[key] !== undefined) return;
      const cut = key.indexOf('#');
      const path = key.slice(0, cut), id = key.slice(cut + 1);
      const prev = st.tomb.filter(function (t) { return t.p === path && t.i === id; })[0];
      if (prev) { prev.u = ts; prev.dev = dev; }
      else st.tomb.push({ p: path, i: id, u: ts, dev: dev });
      touched++;
    });


    // Un registro que reaparece (deshacer) invalida su baja anterior.
    if (st.tomb.length) {
      st.tomb = st.tomb.filter(function (t) {
        return after[t.p + '#' + t.i] === undefined;
      });
    }


    // Escalares: marca de tiempo por campo.
    st.fu = (st.fu && typeof st.fu === 'object') ? st.fu : {};
    Object.keys(after).forEach(function (key) {
      if (key.indexOf('@') < 0) return;
      if (before[key] === after[key]) return;
      st.fu[key] = ts;
      touched++;
    });


    return touched;
  },


  /** Poda de bajas antiguas. Sin esto la lista crecería para siempre; con un
      margen de 90 días, un dispositivo que lleve tres meses apagado podría
      resucitar un registro borrado, que es un riesgo asumible frente a
      guardar bajas indefinidamente. */
  gc: function (st) {
    if (!Array.isArray(st.tomb)) { st.tomb = []; return 0; }
    const limit = Date.now() - 90 * 86400000;
    const before = st.tomb.length;
    st.tomb = st.tomb.filter(function (t) { return t.u >= limit; });
    return before - st.tomb.length;
  },


  /** Fusión de dos estados. `local` gana solo cuando su marca es más reciente;
      ante empate exacto gana el remoto, para que dos dispositivos que fusionen
      a la vez lleguen al mismo resultado en lugar de divergir. */
  merge: function (local, remote) {
    const out = deepCopy(local);
    out.tomb = Array.isArray(out.tomb) ? out.tomb : [];
    out.fu = (out.fu && typeof out.fu === 'object') ? out.fu : {};
    const rTomb = Array.isArray(remote.tomb) ? remote.tomb : [];
    const rFu = (remote.fu && typeof remote.fu === 'object') ? remote.fu : {};


    /* Índice de bajas de ambos lados, quedándose con la más reciente. */
    const tomb = {};
    out.tomb.concat(rTomb).forEach(function (t) {
      if (!t || !t.p || t.i == null) return;
      const k = t.p + '#' + t.i;
      if (!tomb[k] || t.u > tomb[k].u) tomb[k] = { p: t.p, i: t.i, u: t.u, dev: t.dev };
    });


    /* Registros del remoto que hay que incorporar. */
    const remoteRecs = {};
    eachCollection(remote, function (path, arr, idKey) {
      for (let i = 0; i < arr.length; i++) {
        const r = arr[i];
        if (!r || r[idKey] == null) continue;
        remoteRecs[path + '#' + r[idKey]] = { rec: r, path: path, idKey: idKey };
      }
    });


    /* Se asegura de que existan los contenedores del remoto en el resultado. */
    Object.keys(remote.days || {}).forEach(function (k) {
      if (!out.days[k]) out.days[k] = emptyDay();
    });


    const seen = {};
    eachCollection(out, function (path, arr, idKey) {
      for (let i = arr.length - 1; i >= 0; i--) {
        const r = arr[i];
        if (!r || r[idKey] == null) { arr.splice(i, 1); continue; }
        const key = path + '#' + r[idKey];
        seen[key] = true;
        const t = tomb[key];
        const rem = remoteRecs[key];
        const lu = r.u || 0;


        if (rem) {
          // Existe en los dos: gana el sello más alto.
          if ((rem.rec.u || 0) >= lu) arr[i] = deepCopy(rem.rec);
        }
        // Una baja solo se aplica si es posterior a la última edición viva.
        const liveU = Math.max(lu, rem ? (rem.rec.u || 0) : 0);
        if (t && t.u > liveU) arr.splice(i, 1);
      }
    });


    /* Registros que solo tiene el remoto: se añaden salvo que estén dados de
       baja aquí con posterioridad. */
    Object.keys(remoteRecs).forEach(function (key) {
      if (seen[key]) return;
      const info = remoteRecs[key];
      const t = tomb[key];
      if (t && t.u > (info.rec.u || 0)) return;
      const arr = resolveArray(out, info.path);
      if (arr) arr.push(deepCopy(info.rec));
    });


    out.tomb = Object.keys(tomb).map(function (k) { return tomb[k]; });


    /* Escalares: campo a campo, gana la marca más alta. */
    const allKeys = {};
    Object.keys(out.fu).forEach(function (k) { allKeys[k] = true; });
    Object.keys(rFu).forEach(function (k) { allKeys[k] = true; });
    Object.keys(allKeys).forEach(function (key) {
      const lu = out.fu[key] || 0, ru = rFu[key] || 0;
      if (ru < lu) return;                     // lo local es más reciente
      const val = readScalar(remote, key);
      if (val === undefined) return;
      writeScalar(out, key, val);
      out.fu[key] = ru;
    });


    out.schema = SCHEMA_VERSION;
    return out;
  }
};


/* --- Utilidades de la fusión --------------------------------------------- */


/** JSON con las claves ordenadas: sin esto, dos objetos idénticos escritos en
    distinto orden parecerían diferentes y se marcarían como editados. */
function stableJson(v) {
  if (v === null || v === undefined) return '';
  if (typeof v !== 'object') return String(v);
  if (Array.isArray(v)) return '[' + v.map(stableJson).join(',') + ']';
  return '{' + Object.keys(v).sort().filter(function (k) {
    return k !== 'u' && k !== 'dev';          // los sellos no cuentan como cambio
  }).map(function (k) {
    return k + ':' + stableJson(v[k]);
  }).join(',') + '}';
}


function deepCopy(v) {
  return v === undefined ? v : JSON.parse(JSON.stringify(v));
}


/** Localiza el array correspondiente a una ruta, creándolo si hace falta. */
function resolveArray(st, path) {
  const p = path.split('/');
  if (p[0] === 'wg') return st.weights;
  if (p[0] === 'cf') return st.customFoods;
  if (p[0] === 'rc') return st.recipes;
  if (p[0] === 'd') {
    const key = p[1];
    if (!st.days[key]) st.days[key] = emptyDay();
    const d = st.days[key];
    if (p[2] === 'm') return d.meals[p[3]];
    if (p[2] === 'w') return d.water;
    if (p[2] === 'k') return d.workouts;
  }
  return null;
}


function readScalar(st, key) {
  const cut = key.indexOf('@');
  const path = key.slice(0, cut), field = key.slice(cut + 1);
  if (path === 'root') return st[field];
  if (path.indexOf('d/') === 0) {
    const d = (st.days || {})[path.slice(2)];
    return d ? d[field] : undefined;
  }
  const src = st[path];
  return src ? src[field] : undefined;
}


function writeScalar(st, key, val) {
  const cut = key.indexOf('@');
  const path = key.slice(0, cut), field = key.slice(cut + 1);
  if (path === 'root') { st[field] = deepCopy(val); return; }
  if (path.indexOf('d/') === 0) {
    const dk = path.slice(2);
    if (!st.days[dk]) st.days[dk] = emptyDay();
    st.days[dk][field] = deepCopy(val);
    return;
  }
  if (!st[path]) st[path] = {};
  st[path][field] = deepCopy(val);
}


/* ==========================================================================
   NUBE — cuenta y sincronización
   Cliente de Supabase escrito a mano contra su API REST, para no romper la
   regla de cero dependencias. Todo es opcional: sin configurar, la app
   funciona exactamente igual que hasta ahora, en local y sin cuenta.


   Modelo de almacenamiento: un documento JSON por usuario. Con un estado de
   unos 250 KB tras un año de uso, transferirlo entero es más simple y más
   robusto que sincronizar registro a registro, y encaja con la fusión que ya
   existe. Deja de ser buena idea a partir de varios megabytes, momento en que
   habría que pasar a tablas por colección.


   El riesgo real de este modelo es la ACTUALIZACIÓN PERDIDA: si dos
   dispositivos leen la misma versión, fusionan y escriben, el segundo pisa al
   primero. Se resuelve con un número de revisión: el servidor solo acepta la
   escritura si la revisión coincide con la leída; si no, se vuelve a leer,
   se fusiona otra vez y se reintenta.
   ========================================================================== */


const CLOUD_KEY = 'brio.cloud';
const CLOUD_MAX_RETRIES = 4;


const Cloud = {
  cfg: null,        // { url, key }
  session: null,    // { access_token, refresh_token, expires_at, user }
  state: 'off',     // off | idle | syncing | error
  lastError: '',
  lastSync: 0,
  rev: 0,


  /* --- Configuración y sesión ------------------------------------------- */


  load: function () {
    const saved = Store.get(CLOUD_KEY);
    if (saved && typeof saved === 'object') {
      this.cfg = saved.cfg || null;
      this.session = saved.session || null;
      this.lastSync = saved.lastSync || 0;
      this.rev = saved.rev || 0;
    }
    this.state = this.configured() ? (this.session ? 'idle' : 'off') : 'off';
    return this;
  },


  persist: function () {
    Store.set(CLOUD_KEY, {
      cfg: this.cfg, session: this.session, lastSync: this.lastSync, rev: this.rev
    });
  },


  configured: function () { return !!(this.cfg && this.cfg.url && this.cfg.key); },
  signedIn: function () { return !!(this.session && this.session.access_token); },
  email: function () { return this.session && this.session.user ? this.session.user.email : ''; },


  configure: function (url, key) {
    url = String(url || '').trim().replace(/\/+$/, '');
    key = String(key || '').trim();
    if (!/^https:\/\/[^\s]+$/.test(url)) throw new Error('La dirección del proyecto debe empezar por https://');
    if (key.length < 20) throw new Error('La clave pública no parece válida.');
    this.cfg = { url: url, key: key };
    this.state = 'off';
    this.persist();
  },


  /* --- Llamadas HTTP ----------------------------------------------------- */


  headers: function (auth) {
    const h = { 'Content-Type': 'application/json', 'apikey': this.cfg.key };
    h['Authorization'] = 'Bearer ' + ((auth && this.session) ? this.session.access_token : this.cfg.key);
    return h;
  },


  req: function (path, opts) {
    const o = opts || {};
    return fetch(this.cfg.url + path, {
      method: o.method || 'GET',
      headers: Object.assign(this.headers(o.auth !== false), o.headers || {}),
      body: o.body ? JSON.stringify(o.body) : undefined
    }).then(function (res) {
      return res.text().then(function (txt) {
        let data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
        if (!res.ok) {
          const msg = (data && (data.error_description || data.msg || data.message || data.error)) ||
            ('El servidor ha respondido ' + res.status + '.');
          const err = new Error(msg);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  },


  /** Renueva el token si está a punto de caducar. Sin esto, una sesión de más
      de una hora empezaría a fallar en silencio. */
  ensureFresh: function () {
    const self = this;
    if (!this.signedIn()) return Promise.reject(new Error('No has iniciado sesión.'));
    const margin = 60;
    if (this.session.expires_at && this.session.expires_at - margin > Math.floor(Date.now() / 1000)) {
      return Promise.resolve();
    }
    if (!this.session.refresh_token) return Promise.resolve();
    return this.req('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', auth: false, body: { refresh_token: this.session.refresh_token }
    }).then(function (d) {
      self.setSession(d);
    }).catch(function () {
      // Si la renovación falla, se cierra la sesión en vez de dejarla rota.
      self.signOutLocal();
      throw new Error('Tu sesión ha caducado. Vuelve a iniciar sesión.');
    });
  },


  setSession: function (d) {
    if (!d || !d.access_token) return;
    this.session = {
      access_token: d.access_token,
      refresh_token: d.refresh_token || (this.session && this.session.refresh_token),
      expires_at: d.expires_at || (Math.floor(Date.now() / 1000) + (d.expires_in || 3600)),
      user: d.user || (this.session && this.session.user) || null
    };
    this.state = 'idle';
    this.persist();
  },


  /* --- Autenticación ----------------------------------------------------- */


  signUp: function (email, password) {
    const self = this;
    return this.req('/auth/v1/signup', {
      method: 'POST', auth: false, body: { email: email, password: password }
    }).then(function (d) {
      // Si el proyecto exige confirmar el correo, no llega token todavía.
      if (d && d.access_token) self.setSession(d);
      return d;
    });
  },


  signIn: function (email, password) {
    const self = this;
    return this.req('/auth/v1/token?grant_type=password', {
      method: 'POST', auth: false, body: { email: email, password: password }
    }).then(function (d) { self.setSession(d); return d; });
  },


  /** Inicio de sesión con Google o Apple. Requiere que la app se sirva desde
      una dirección https: desde un archivo abierto con doble clic el
      proveedor no puede devolver el control y el flujo no se completa. */
  oauthUrl: function (provider) {
    const redirect = (typeof location !== 'undefined' && location.origin && location.origin !== 'null')
      ? location.origin + location.pathname : '';
    if (!redirect || redirect.indexOf('http') !== 0) return null;
    return this.cfg.url + '/auth/v1/authorize?provider=' + encodeURIComponent(provider) +
      '&redirect_to=' + encodeURIComponent(redirect);
  },


  /** Recoge el token que el proveedor deja en el fragmento de la dirección. */
  captureOAuthRedirect: function () {
    if (typeof location === 'undefined' || !location.hash || location.hash.length < 10) return false;
    const h = location.hash.replace(/^#/, '');
    if (h.indexOf('access_token=') < 0) return false;
    const p = {};
    h.split('&').forEach(function (kv) {
      const i = kv.indexOf('=');
      if (i > 0) p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    if (!p.access_token) return false;
    this.setSession({
      access_token: p.access_token,
      refresh_token: p.refresh_token,
      expires_in: Number(p.expires_in || 3600)
    });
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* da igual */ }
    return true;
  },


  signOutLocal: function () {
    this.session = null;
    this.rev = 0;
    this.state = this.configured() ? 'off' : 'off';
    this.persist();
  },


  signOut: function () {
    const self = this;
    const done = function () { self.signOutLocal(); };
    if (!this.signedIn()) { done(); return Promise.resolve(); }
    return this.req('/auth/v1/logout', { method: 'POST' }).then(done, done);
  },


  /* --- Documento remoto -------------------------------------------------- */


  pull: function () {
    const self = this;
    return this.req('/rest/v1/brio_state?select=doc,rev&limit=1', { method: 'GET' })
      .then(function (rows) {
        if (!rows || !rows.length) return { doc: null, rev: 0 };
        return { doc: rows[0].doc, rev: Number(rows[0].rev) || 0 };
      });
  },


  /** Escritura con revisión: el servidor la rechaza si otro dispositivo ha
      escrito entretanto. Devuelve null en ese caso para que se reintente. */
  push: function (doc, expectedRev) {
    return this.req('/rest/v1/rpc/brio_push', {
      method: 'POST', body: { p_doc: doc, p_rev: expectedRev }
    }).then(function (r) {
      const rev = (r && (r.rev !== undefined ? r.rev : r)) || null;
      return (rev === null || rev === undefined || rev === false) ? null : Number(rev);
    });
  },


  /* --- Sincronización ---------------------------------------------------- */


  /** Trae, fusiona y devuelve. Reintenta si otro dispositivo se adelanta.
      Todo el peso conceptual está en Sync.merge, que ya está probado. */
  sync: function () {
    const self = this;
    if (!this.configured()) return Promise.reject(new Error('Todavía no has conectado ningún proyecto.'));
    if (!this.signedIn()) return Promise.reject(new Error('No has iniciado sesión.'));
    if (this.state === 'syncing') return Promise.reject(new Error('Ya hay una sincronización en curso.'));


    this.state = 'syncing';
    this.lastError = '';
    Router.refreshCloud();


    State.saveNow();   // asegura que lo pendiente esté sellado antes de fusionar


    function attempt(n) {
      return self.ensureFresh().then(function () {
        return self.pull();
      }).then(function (remote) {
        const merged = remote.doc ? Sync.merge(State.data, migrate(remote.doc)) : deepCopy(State.data);
        Sync.gc(merged);
        return self.push(merged, remote.rev).then(function (newRev) {
          if (newRev === null) {
            // Otro dispositivo escribió entre la lectura y la escritura.
            if (n >= CLOUD_MAX_RETRIES) throw new Error('No se ha podido cerrar la sincronización tras varios intentos. Inténtalo de nuevo.');
            return attempt(n + 1);
          }
          self.rev = newRev;
          self.lastSync = Date.now();
          State.replace(merged);
          self.state = 'idle';
          self.persist();
          return merged;
        });
      });
    }


    return attempt(0).catch(function (e) {
      self.state = 'error';
      self.lastError = e && e.message ? e.message : 'Error desconocido.';
      throw e;
    }).then(function (r) {
      Router.refreshCloud();
      return r;
    }, function (e) {
      Router.refreshCloud();
      throw e;
    });
  },


  /** Borrado de la copia en la nube. Los datos locales no se tocan. */
  wipeRemote: function () {
    const self = this;
    return this.ensureFresh().then(function () {
      return self.req('/rest/v1/brio_state?user_id=eq.' + encodeURIComponent(self.session.user.id), { method: 'DELETE' });
    }).then(function () { self.rev = 0; self.lastSync = 0; self.persist(); });
  }
};


/* --- Migración de esquema ------------------------------------------------ */
function migrate(raw) {
  const base = defaultState();
  // Un volcado corrupto (texto suelto, array, null) se descarta y se parte de
  // cero en lugar de propagar el error hacia la interfaz.
  const out = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};


  // v0 → v1: normaliza claves ausentes preservando todo lo que el usuario tenga.
  out.profile = Object.assign({}, base.profile, out.profile || {});
  out.settings = Object.assign({}, base.settings, out.settings || {});
  out.goals = Object.assign({}, base.goals, out.goals || {});
  out.days = (out.days && typeof out.days === 'object' && !Array.isArray(out.days)) ? out.days : {};
  out.weights = Array.isArray(out.weights) ? out.weights : [];
  out.customFoods = (Array.isArray(out.customFoods) ? out.customFoods : [])
    .map(sanitizeCustomFood).filter(Boolean);
  out.recipes = (Array.isArray(out.recipes) ? out.recipes : [])
    .map(sanitizeUserRecipe).filter(Boolean);
  out.favorites = Array.isArray(out.favorites) ? out.favorites : [];
  // Solo se conservan ids de recetas que sigan existiendo en el catálogo.
  out.favRecipes = (Array.isArray(out.favRecipes) ? out.favRecipes : [])
    .filter(function (id) { return !!RECIPE_BY_ID[id]; });
  // Solo ids de alimento que sigan existiendo; los propios entran en el índice
  // más tarde, así que aquí se admite cualquier cadena no vacía.
  out.pantry = (Array.isArray(out.pantry) ? out.pantry : [])
    .filter(function (id) { return typeof id === 'string' && id; });
  out.recents = Array.isArray(out.recents) ? out.recents : [];
  out.onboarded = !!out.onboarded;
  // v1 → v2: los acentos retirados del selector se reconducen para que la
  // rejilla de Ajustes nunca quede sin ninguna opción marcada.
  out.settings.pantryBasics = out.settings.pantryBasics !== false;
  /* v2 → v3: los datos anteriores no traen sellos de tiempo. Se les pone uno
     antiguo en lugar de la hora actual: si se sellaran como «recién editados»,
     al sincronizar por primera vez pisarían cambios legítimos hechos después
     en otro dispositivo. */
  out.tomb = Array.isArray(out.tomb) ? out.tomb.filter(function (t) {
    return t && t.p && t.i != null && typeof t.u === 'number';
  }) : [];
  out.fu = (out.fu && typeof out.fu === 'object') ? out.fu : {};
  out.deviceId = typeof out.deviceId === 'string' ? out.deviceId : '';
  if (ACCENT_IDS.indexOf(out.settings.accent) < 0) {
    out.settings.accent = out.settings.accent === 'teal' ? 'blue'
      : (out.settings.accent === 'yellow' ? 'orange'
      : (out.settings.accent === 'pink' ? 'purple' : 'green'));
  }
  out.schema = SCHEMA_VERSION;


  // Saneado de días
  Object.keys(out.days).forEach(function (k) {
    const d = out.days[k];
    if (!d || typeof d !== 'object') { delete out.days[k]; return; }
    if (!d.meals || typeof d.meals !== 'object') d.meals = {};
    MEALS.forEach(function (m) { if (!Array.isArray(d.meals[m.id])) d.meals[m.id] = []; });
    if (!Array.isArray(d.water)) d.water = [];
    if (!Array.isArray(d.workouts)) d.workouts = [];
    if (typeof d.steps !== 'number' || !isFinite(d.steps)) d.steps = 0;
    if (d.sleep && (typeof d.sleep.bed !== 'number' || typeof d.sleep.wake !== 'number')) d.sleep = null;
    d.note = typeof d.note === 'string' ? d.note.slice(0, NOTE_MAX) : '';
  });


  out.weights = out.weights.filter(function (w) {
    return w && typeof w.date === 'string' && typeof w.kg === 'number' && isFinite(w.kg);
  });
  out.weights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  return out;
}


/* --------------------------------------------------------------------------
   ETIQUETAS NUTRICIONALES DE LAS RECETAS
   Se calculan, no se escriben a mano: así una etiqueta nunca puede contradecir
   a los ingredientes. Los umbrales siguen el Reglamento (CE) 1924/2006 sobre
   declaraciones nutricionales siempre que exista un equivalente legal; los dos
   que no lo tienen se marcan como criterio propio y se explican en la app.


   No se ofrece filtro «sin gluten» a propósito. Determinarlo desde nombres
   genéricos de ingrediente no es fiable (la avena suele estar contaminada, la
   salsa de soja lleva trigo) y para una persona celíaca un falso positivo es
   un problema de salud, no una molestia.
   -------------------------------------------------------------------------- */


/* Ingredientes de origen animal que no quedan cubiertos por su categoría. */
const NON_VEGETARIAN_IDS = { f683: 1, f684: 1, f942: 1, f232: 1 };
const NON_VEGAN_IDS = { f279: 1 };
const NON_VEGETARIAN_CATS = { carne: 1, pescado: 1 };
const NON_VEGAN_CATS = { carne: 1, pescado: 1, lacteo: 1 };


const RECIPE_FILTERS = [
  { id: 'prot',   n: 'Alto en proteína', why: 'Al menos el 20 % de la energía procede de la proteína (Reglamento CE 1924/2006).',
    test: function (r) { return r.per100.kcal > 0 && (r.per100.prot * 4) / r.per100.kcal >= 0.20; } },
  { id: 'lowfat', n: 'Bajo en grasa', why: 'Como máximo 3 g de grasa por 100 g (Reglamento CE 1924/2006).',
    test: function (r) { return r.per100.fat <= 3; } },
  { id: 'lowcal', n: 'Ligera', why: 'Como máximo 400 kcal por ración. Criterio propio, pensado para un plato completo.',
    test: function (r) { return r.perServing.kcal <= 400; } },
  { id: 'fiber',  n: 'Fuente de fibra', why: 'Al menos 3 g de fibra por 100 g (Reglamento CE 1924/2006). El umbral de «alto en fibra» es de 6 g, que casi ningún plato cocinado alcanza porque el agua diluye la proporción.',
    test: function (r) { return r.per100.fib >= 3; } },
  { id: 'lowcarb', n: 'Bajo en hidratos', why: 'Como máximo 20 g de hidratos por ración. Criterio propio: no existe definición legal, y por ración es más informativo que por 100 g en un plato cocinado.',
    test: function (r) { return r.perServing.carb <= 20; } },
  { id: 'lowsug', n: 'Bajo en azúcares', why: 'Como máximo 5 g de azúcares por 100 g (Reglamento CE 1924/2006).',
    test: function (r) { return r.per100.sug != null && r.per100.sug <= 5; } },
  { id: 'veg',    n: 'Vegetariana', why: 'Sin carne ni pescado ni derivados como la gelatina.',
    test: function (r) { return r.vegetarian; } },
  { id: 'vegan',  n: 'Vegana', why: 'Sin ningún ingrediente de origen animal, tampoco huevo, lácteos ni miel.',
    test: function (r) { return r.vegan; } },
  { id: 'quick',  n: 'En 20 minutos', why: 'Veinte minutos o menos de principio a fin.',
    test: function (r) { return r.minutes <= 20; } }
];


/* Índice de alimentos por id, necesario para calcular las recetas. */
const FOOD_BY_ID = {};
BASE_FOODS.forEach(function (f) { FOOD_BY_ID[f.id] = f; });


/* Construcción de las recetas: suma los ingredientes y reparte por ración.
   Una receta cuyos ingredientes no se encuentren se descarta en silencio en
   lugar de propagar valores a medias. */
function buildRecipe(t) {
  const servings = Math.max(1, t[3] | 0);
  const ing = [];
  let totalG = 0;
  const sum = { kcal: 0, prot: 0, carb: 0, fat: 0, fib: 0, sug: 0, sat: 0, sod: 0 };
  let sugOk = true, satOk = true, sodOk = true;
  let vegetarian = true, vegan = true;


  for (let i = 0; i < t[5].length; i++) {
    const f = FOOD_BY_ID[t[5][i][0]];
    if (!f) return null;
    const g = t[5][i][1];
    const k = g / 100;
    sum.kcal += f.kcal * k;
    sum.prot += f.prot * k;
    sum.carb += f.carb * k;
    sum.fat  += f.fat  * k;
    sum.fib  += f.fib  * k;
    if (f.sug == null) sugOk = false; else sum.sug += f.sug * k;
    if (f.sat == null) satOk = false; else sum.sat += f.sat * k;
    if (f.sod == null) sodOk = false; else sum.sod += f.sod * k;
    totalG += g;
    ing.push({ id: f.id, name: f.name, g: g, base: f.base, kcal: f.kcal * k });
    if (NON_VEGETARIAN_CATS[f.cat] || NON_VEGETARIAN_IDS[f.id]) vegetarian = false;
    if (NON_VEGAN_CATS[f.cat] || NON_VEGETARIAN_IDS[f.id] || NON_VEGAN_IDS[f.id]) vegan = false;
  }


  const perServG = totalG / servings;
  const per100 = {};
  ['kcal', 'prot', 'carb', 'fat', 'fib'].forEach(function (key) {
    per100[key] = totalG ? sum[key] * 100 / totalG : 0;
  });
  per100.sug = sugOk && totalG ? sum.sug * 100 / totalG : null;
  per100.sat = satOk && totalG ? sum.sat * 100 / totalG : null;
  per100.sod = sodOk && totalG ? sum.sod * 100 / totalG : null;


  const r = {
    id: t[0], name: t[1], cat: t[2], servings: servings, minutes: t[4],
    ing: ing, steps: t[6], tags: t[7] || [],
    vegetarian: vegetarian, vegan: vegan,
    totalG: round(totalG, 0), servingG: round(perServG, 0),
    per100: per100,
    perServing: {
      kcal: sum.kcal / servings, prot: sum.prot / servings, carb: sum.carb / servings,
      fat: sum.fat / servings, fib: sum.fib / servings,
      sug: sugOk ? sum.sug / servings : null,
      sat: satOk ? sum.sat / servings : null,
      sod: sodOk ? sum.sod / servings : null
    }
  };
  // Las etiquetas se derivan de lo ya calculado, nunca se declaran.
  r.badges = RECIPE_FILTERS.filter(function (f) { return f.test(r); }).map(function (f) { return f.id; });
  return r;
}


/** Nombre visible de una etiqueta calculada. */
function filterName(id) {
  for (let i = 0; i < RECIPE_FILTERS.length; i++) if (RECIPE_FILTERS[i].id === id) return RECIPE_FILTERS[i].n;
  return id;
}


const BASE_RECIPES = RECIPE_TUPLES.map(buildRecipe).filter(Boolean);
const RECIPE_BY_ID = {};
BASE_RECIPES.forEach(function (r) { RECIPE_BY_ID[r.id] = r; });


/* Cada receta se expone además como alimento buscable, de modo que se registre
   por raciones con el mismo flujo que cualquier otro alimento. */
function recipeAsFood(r) {
  return {
    id: r.id, name: r.name, cat: 'receta_base', builtinRecipe: true,
    kcal: r.per100.kcal, prot: r.per100.prot, carb: r.per100.carb,
    fat: r.per100.fat, fib: r.per100.fib,
    sug: r.per100.sug, sat: r.per100.sat, sod: r.per100.sod,
    units: [{ name: 'ración', g: r.servingG }],
    base: 'g', custom: false
  };
}
const RECIPE_FOODS = BASE_RECIPES.map(recipeAsFood);


/* ==========================================================================
   ÍNDICE DE ALIMENTOS
   Se precomputa una vez al arrancar y en cada cambio de alimentos propios:
   nombre normalizado listo para comparar. Buscar nunca vuelve a normalizar.
   ========================================================================== */
const FoodIndex = {
  all: [],
  byId: {},
  index: [],


  rebuild: function () {
    const customs = State.data.customFoods.map(function (f) {
      return Object.assign({}, f, { custom: true, cat: 'propio' });
    });
    const recipes = State.data.recipes.map(function (r) {
      return {
        id: r.id, name: r.name, cat: 'receta', recipe: true,
        kcal: r.per100.kcal, prot: r.per100.prot, carb: r.per100.carb, fat: r.per100.fat,
        fib: r.per100.fib, sug: null, sat: null, sod: null,
        units: [{ name: 'ración', g: r.servingG }], base: 'g', custom: true
      };
    });
    this.all = BASE_FOODS.concat(RECIPE_FOODS, customs, recipes);
    this.byId = {};
    this.index = [];
    for (let i = 0; i < this.all.length; i++) {
      const f = this.all[i];
      this.byId[f.id] = f;
      this.index.push({ n: norm(f.name), f: f });
    }
  },


  get: function (id) { return this.byId[id] || null; },


  /** Búsqueda: prefijo exacto > prefijo de palabra > subcadena. */
  /* Se exige que aparezcan todas las palabras de la consulta, en cualquier
     orden, de modo que «pechuga pollo» y «pollo pechuga» encuentren lo mismo.
     Cada palabra puntúa según dónde encaje: al principio del nombre (3), al
     principio de otra palabra (2) o en cualquier posición (1). */
  search: function (q, cat, limit) {
    const nq = norm(q || '').trim();
    const terms = nq ? nq.split(/\s+/) : [];
    const lim = limit || 60;
    const res = [];
    for (let i = 0; i < this.index.length; i++) {
      const it = this.index[i];
      if (cat && cat !== 'all' && it.f.cat !== cat) continue;
      if (!terms.length) { res.push({ f: it.f, s: 0 }); continue; }
      let total = 0, all = true;
      for (let j = 0; j < terms.length; j++) {
        const t = terms[j];
        let sc = -1;
        if (it.n.indexOf(t) === 0) sc = 3;
        else if (it.n.indexOf(' ' + t) >= 0) sc = 2;
        else if (it.n.indexOf(t) > 0) sc = 1;
        if (sc < 0) { all = false; break; }
        total += sc;
      }
      if (!all) continue;
      res.push({ f: it.f, s: total / terms.length });
    }
    res.sort(function (a, b) {
      if (b.s !== a.s) return b.s - a.s;
      if (a.f.name.length !== b.f.name.length) return a.f.name.length - b.f.name.length;
      return a.f.name < b.f.name ? -1 : 1;
    });
    return res.slice(0, lim).map(function (r) { return r.f; });
  }
};


function categoryOf(id) {
  return CATEGORIES.filter(function (c) { return c.id === id; })[0] || CATEGORIES[0];
}


/* --- Cálculo nutricional de una entrada --------------------------------- */
/** Valores nutricionales de `grams` gramos del alimento `f`. */
function nutrientsFor(f, grams) {
  const k = grams / 100;
  return {
    kcal: f.kcal * k,
    prot: f.prot * k,
    carb: f.carb * k,
    fat: f.fat * k,
    fib: (f.fib || 0) * k,
    sug: f.sug == null ? null : f.sug * k,
    sat: f.sat == null ? null : f.sat * k,
    sod: f.sod == null ? null : f.sod * k
  };
}


function emptyTotals() {
  return { kcal: 0, prot: 0, carb: 0, fat: 0, fib: 0, sug: 0, sat: 0, sod: 0, hasSug: false, hasSat: false, hasSod: false };
}


function addEntry(tot, e) {
  tot.kcal += e.kcal || 0;
  tot.prot += e.prot || 0;
  tot.carb += e.carb || 0;
  tot.fat += e.fat || 0;
  tot.fib += e.fib || 0;
  if (e.sug != null) { tot.sug += e.sug; tot.hasSug = true; }
  if (e.sat != null) { tot.sat += e.sat; tot.hasSat = true; }
  if (e.sod != null) { tot.sod += e.sod; tot.hasSod = true; }
  return tot;
}


/* Los totales de un día se recalculan muchas veces dentro de un mismo
   repintado (resúmenes, rachas, rejilla de cumplimiento, conclusiones).
   Se memorizan por fecha y la caché se vacía en cuanto cambia el estado. */
let TOTALS_CACHE = Object.create(null);
function invalidateTotals() { TOTALS_CACHE = Object.create(null); }


function dayTotals(key) {
  const hit = TOTALS_CACHE[key];
  if (hit) return hit;
  const d = State.day(key);
  const t = emptyTotals();
  MEALS.forEach(function (m) {
    (d.meals[m.id] || []).forEach(function (e) { addEntry(t, e); });
  });
  TOTALS_CACHE[key] = t;
  return t;
}


function mealTotals(key, mealId) {
  const t = emptyTotals();
  (State.day(key).meals[mealId] || []).forEach(function (e) { addEntry(t, e); });
  return t;
}


function waterTotal(key) {
  return sum(State.day(key).water || [], function (w) { return w.ml; });
}


function workoutKcalTotal(key) {
  return sum(State.day(key).workouts || [], function (w) { return w.kcal; });
}


function workoutMinTotal(key) {
  return sum(State.day(key).workouts || [], function (w) { return w.min; });
}


/** Gasto por pasos del día, con el peso vigente en esa fecha. */
function stepsKcal(key) {
  const d = State.day(key);
  const p = State.data.profile;
  const w = State.latestWeight(key);
  return Domain.kcalFromSteps(d.steps || 0, p.sex, p.height, w ? w.kg : p.weight);
}


/** Objetivo calórico efectivo del día (ajustado por actividad si procede). */
function kcalGoalFor(key) {
  const g = State.data.goals.kcal;
  if (!State.data.settings.activityAdjust) return g;
  return g + workoutKcalTotal(key) + stepsKcal(key);
}


/** Objetivos cumplidos ese día (para racha y rejilla de cumplimiento). */
function goalsMet(key) {
  const d = State.data.days[key];
  if (!d) return { list: [], count: 0, total: 4 };
  const g = State.data.goals;
  const t = dayTotals(key);
  const list = [];
  const kcalGoal = kcalGoalFor(key);
  if (t.kcal > 0 && t.kcal <= kcalGoal * 1.05) list.push('kcal');
  if ((d.steps || 0) >= g.steps) list.push('pasos');
  if (waterTotal(key) >= g.water) list.push('agua');
  if (d.sleep && Domain.sleepMinutes(d.sleep.bed, d.sleep.wake) >= g.sleep) list.push('sueño');
  return { list: list, count: list.length, total: 4 };
}


/** Racha: días consecutivos (hasta ayer/hoy) con 3 o más objetivos cumplidos. */
function currentStreak() {
  let k = todayKey();
  let n = 0;
  if (goalsMet(k).count < 3) k = addDays(k, -1);
  for (let i = 0; i < 400; i++) {
    if (goalsMet(k).count >= 3) { n++; k = addDays(k, -1); }
    else break;
  }
  return n;
}

/* --- Gestión de foco en capas modales ----------------------------------- */
function focusables(root) {
  return $$('button, input, select, textarea, [tabindex]:not([tabindex="-1"])', root)
    .filter(function (el) { return !el.disabled && el.getClientRects().length > 0; });
}


/** Mantiene el tabulador dentro de la capa modal activa. */
function trapTab(container, e) {
  if (e.key !== 'Tab') return;
  const list = focusables(container);
  if (!list.length) { e.preventDefault(); return; }
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && (document.activeElement === first || !container.contains(document.activeElement))) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
}


/* --- Aviso flotante ------------------------------------------------------ */
const Toast = {
  show: function (msg, ico) { return Toast._make(msg, ico, null, null, 2000); },


  /** Aviso con botón de deshacer. La acción dispone de seis segundos: el
      tiempo suficiente para reaccionar sin dejar el aviso estorbando. */
  undo: function (msg, cb) { return Toast._make(msg, 'check', 'Deshacer', cb, 6000); },


  _make: function (msg, ico, actionLabel, cb, ms) {
    const host = $('#toast-host');
    if (!host) return;
    // Solo un aviso a la vez: encadenar dos deshaceres es confuso y además
    // el segundo taparía al primero antes de poder pulsarlo.
    Array.prototype.slice.call(host.children).forEach(function (old) {
      if (old.parentNode) old.parentNode.removeChild(old);
    });
    const el = document.createElement('div');
    el.className = 'toast' + (actionLabel ? ' with-action' : '');
    el.innerHTML = (ico ? icon(ico, 18, { w: 2 }) : '') + '<span>' + esc(msg) + '</span>' +
      (actionLabel ? '<button type="button" class="toast-act">' + esc(actionLabel) + '</button>' : '');
    host.appendChild(el);


    let done = false;
    function dismiss() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      el.classList.add('out');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
    }
    const timer = setTimeout(dismiss, ms);


    if (actionLabel) {
      const btn = $('.toast-act', el);
      btn.addEventListener('click', function () {
        dismiss();
        try { cb(); } catch (e) { Toast.show('No se ha podido deshacer', 'warn'); }
      });
    }
    return el;
  }
};


/* --- Diálogos propios (nunca alert/confirm/prompt del navegador) --------- */
const Dialog = {
  open: function (opts) {
    return new Promise(function (resolve) {
      const host = $('#sheet-host');
      const returnTo = document.activeElement;
      const wrap = document.createElement('div');
      wrap.style.position = 'absolute';
      wrap.style.inset = '0';
      wrap.style.pointerEvents = 'auto';
      const actions = opts.actions || [{ label: 'Aceptar', value: true, strong: true }];
      wrap.innerHTML =
        '<div class="scrim"></div>' +
        '<div class="dialog" role="alertdialog" aria-modal="true" aria-label="' + esc(opts.title || 'Aviso') + '">' +
          '<div class="dialog-body">' +
            (opts.title ? '<h3 class="dialog-title">' + esc(opts.title) + '</h3>' : '') +
            (opts.msg ? '<p class="dialog-msg">' + esc(opts.msg) + '</p>' : '') +
          '</div>' +
          '<div class="dialog-actions">' +
            actions.map(function (a, i) {
              return '<button type="button" data-i="' + i + '" class="' +
                (a.strong ? 'strong ' : '') + (a.destructive ? 'destructive' : '') + '">' + esc(a.label) + '</button>';
            }).join('') +
          '</div>' +
        '</div>';
      host.appendChild(wrap);
      const scrim = $('.scrim', wrap);
      const dlg = $('.dialog', wrap);
      requestAnimationFrame(function () { scrim.classList.add('on'); dlg.classList.add('on'); });


      function close(val) {
        scrim.classList.remove('on'); dlg.classList.remove('on');
        setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 220);
        document.removeEventListener('keydown', onKey, true);
        if (returnTo && returnTo.focus && returnTo.isConnected) { try { returnTo.focus(); } catch (e) {} }
        resolve(val);
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.stopPropagation(); close(null); return; }
        trapTab(dlg, e);
      }
      document.addEventListener('keydown', onKey, true);
      scrim.addEventListener('click', function () { close(null); });
      $$('button', dlg).forEach(function (b) {
        b.addEventListener('click', function () { close(actions[Number(b.dataset.i)].value); });
      });
      const focusBtn = $$('button', dlg).slice(-1)[0];
      if (focusBtn) focusBtn.focus();
    });
  },
  alert: function (title, msg) {
    return Dialog.open({ title: title, msg: msg, actions: [{ label: 'Entendido', value: true, strong: true }] });
  },
  confirm: function (title, msg, okLabel, destructive) {
    return Dialog.open({
      title: title, msg: msg,
      actions: [
        { label: 'Cancelar', value: false },
        { label: okLabel || 'Aceptar', value: true, strong: true, destructive: !!destructive }
      ]
    });
  }
};


/* --- Hoja modal ---------------------------------------------------------- */
const Sheet = {
  stack: [],
  open: function (opts) {
    const host = $('#sheet-host');
    const returnTo = document.activeElement;
    const wrap = document.createElement('div');
    wrap.style.position = 'absolute';
    wrap.style.inset = '0';
    wrap.style.pointerEvents = 'auto';
    const leftLabel = opts.left === null ? '' : (opts.left || 'Cancelar');
    const rightLabel = opts.right || '';
    wrap.innerHTML =
      '<div class="scrim"></div>' +
      '<section class="sheet" role="dialog" aria-modal="true" tabindex="-1" aria-label="' + esc(opts.title || 'Panel') + '">' +
        '<div class="sheet-grab" aria-hidden="true"><i></i></div>' +
        '<header class="sheet-head">' +
          '<button type="button" class="btn plain js-left">' + esc(leftLabel) + '</button>' +
          '<h3 class="sheet-title">' + esc(opts.title || '') + '</h3>' +
          (rightLabel
            ? '<button type="button" class="btn plain js-right" style="font-weight:600">' + esc(rightLabel) + '</button>'
            : '<span style="min-width:60px"></span>') +
        '</header>' +
        '<div class="sheet-body">' + (opts.body || '') + '</div>' +
        (opts.footer ? '<div class="sheet-foot">' + opts.footer + '</div>' : '') +
      '</section>';
    host.appendChild(wrap);
    document.body.classList.add('no-scroll');


    const scrim = $('.scrim', wrap);
    const sheet = $('.sheet', wrap);
    const handle = {
      el: sheet, wrap: wrap, body: $('.sheet-body', wrap),
      closed: false,
      close: function (result) { close(result); }
    };


    let closed = false;
    function close(result) {
      if (closed) return;
      closed = true;
      handle.closed = true;
      scrim.classList.remove('on');
      sheet.classList.remove('on');
      sheet.style.transform = '';
      // La hoja permanece en el DOM mientras dura la animación de salida. Se le
      // retiran los identificadores para que no colisionen con los de una hoja
      // nueva abierta en ese intervalo.
      $$('[id]', wrap).forEach(function (n) { n.removeAttribute('id'); });
      const i = Sheet.stack.indexOf(handle);
      if (i >= 0) Sheet.stack.splice(i, 1);
      setTimeout(function () {
        if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
        if (!Sheet.stack.length) document.body.classList.remove('no-scroll');
      }, 320);
      document.removeEventListener('keydown', onKey, true);
      if (returnTo && returnTo.focus && returnTo.isConnected) { try { returnTo.focus(); } catch (e) {} }
      if (opts.onClose) opts.onClose(result);
    }
    function onKey(e) {
      if (Sheet.stack[Sheet.stack.length - 1] !== handle) return;
      if (e.key === 'Escape') { e.stopPropagation(); close(null); return; }
      trapTab(sheet, e);
    }
    document.addEventListener('keydown', onKey, true);
    scrim.addEventListener('click', function () { close(null); });
    const lb = $('.js-left', wrap);
    if (lb) lb.addEventListener('click', function () { close(null); });
    const rb = $('.js-right', wrap);
    if (rb && opts.onConfirm) rb.addEventListener('click', function () { opts.onConfirm(handle); });


    /* Cierre por gesto de arrastre */
    const grab = $('.sheet-grab', wrap);
    let startY = 0, dy = 0, dragging = false;
    grab.addEventListener('pointerdown', function (e) {
      dragging = true; startY = e.clientY; dy = 0;
      sheet.style.transition = 'none';
      if (grab.setPointerCapture && e.pointerId != null) { try { grab.setPointerCapture(e.pointerId); } catch (err) {} }
    });
    grab.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - startY);
      sheet.style.transform = 'translate(-50%, ' + dy + 'px)';
    });
    function up() {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = '';
      sheet.style.transform = '';
      if (dy > 110) close(null);
    }
    grab.addEventListener('pointerup', up);
    grab.addEventListener('pointercancel', up);


    Sheet.stack.push(handle);
    requestAnimationFrame(function () {
      scrim.classList.add('on');
      sheet.classList.add('on');
      if (closed) return;                 // se cerró antes de llegar a pintarse
      if (opts.onMount) opts.onMount(handle);
      if (opts.focus === true) {
        const inp = sheet.querySelector('.sheet-body input, .sheet-body textarea');
        if (inp) { try { inp.focus(); } catch (e) {} return; }
      }
      try { sheet.focus(); } catch (e) {}
    });
    return handle;
  }
};

const Rings = {
  render: function (prefix, values, size) {

      { r: S * 0.395, w: S * 0.105, color: '--c-nutri', key: 'kcal' },

    conf.forEach(function (o, i) {
      const circ = 2 * Math.PI * o.r;

};

}


const Charts = {
  /* Gráfico de barras con línea de objetivo opcional. */
  bar: function (o) {

    const H = o.height || 150;
    const padB = 22, padT = 8;
    const plotH = H - padB - padT;

    let max = 0;
    data.forEach(function (d) { if (d.value > max) max = d.value; });
    if (o.goal) max = Math.max(max, o.goal);
    if (max <= 0) max = 1;
    max = max * 1.12;
    const n = data.length;
    const slot = CH_W / n;
    const bw = Math.max(4, Math.min(slot * 0.62, 26));
    const tips = [];
    let bars = '', labels = '';
    data.forEach(function (d, i) {
      const x = slot * i + slot / 2;
      const h = Math.max(d.value > 0 ? 3 : 0, plotH * (d.value / max));
      const y = padT + plotH - h;
      const col = d.color || o.color || '--accent';
      bars += '<rect class="bar-rect" x="' + round(x - bw / 2, 1) + '" y="' + round(y, 1) + '" width="' + round(bw, 1) +

        (d.dim ? 0.35 : 0.95) + '"/>';

      }

    });
    let grid = '';
    [0, 0.5, 1].forEach(function (f) {
      const y = padT + plotH * f;
      grid += '<line class="grid-line" x1="0" y1="' + round(y, 1) + '" x2="' + CH_W + '" y2="' + round(y, 1) + '"/>';
    });
    let goalLine = '';
    if (o.goal) {
      const gy = padT + plotH * (1 - o.goal / max);
      goalLine = '<line class="goal-line" x1="0" y1="' + round(gy, 1) + '" x2="' + CH_W + '" y2="' + round(gy, 1) + '"/>' +
        '<text class="axis-label" x="' + (CH_W - 2) + '" y="' + round(gy - 4, 1) + '" text-anchor="end">' + esc(o.goalLabel || 'Objetivo') + '</text>';

      '<line class="cursor" x1="0" y1="' + padT + '" x2="0" y2="' + (padT + plotH) + '" stroke="var(--txt-2)" stroke-width="1" style="display:none"/>' +
      '</svg>';
    return chartHolder(inner, tips);
  },


  /* Gráfico de líneas con media móvil opcional y huecos gestionados. */
  line: function (o) {
    const data = o.data || [];
    const H = o.height || 170;
    const padB = 22, padT = 10, padL = 30;
    const plotH = H - padB - padT;
    const plotW = CH_W - padL - 6;
    const vals = data.map(function (d) { return d.value; }).filter(function (v) { return v != null; });
    if (!vals.length) return '';
    let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (o.goal != null) { min = Math.min(min, o.goal); max = Math.max(max, o.goal); }
    if (o.zero) min = 0;
    if (max === min) { max = max + 1; min = Math.max(0, min - 1); }
    const span = max - min;
    min = min - span * 0.12; max = max + span * 0.12;
    const n = data.length;
    function X(i) { return padL + (n === 1 ? plotW / 2 : plotW * (i / (n - 1))); }
    function Y(v) { return padT + plotH * (1 - (v - min) / (max - min)); }


    let grid = '', axis = '';
    [0, 0.5, 1].forEach(function (f) {
      const y = padT + plotH * f;
      const v = max - (max - min) * f;

      axis += '<text class="axis-label" x="' + (padL - 5) + '" y="' + round(y + 4, 1) + '" text-anchor="end">' + esc(nf(v, o.dec == null ? 0 : o.dec)) + '</text>';
    });

      else seg.push([X(i), Y(d.value)]);
    });
    if (seg.length) segs.push(seg);
    segs.forEach(function (s) { path += smoothPath(s); });

      const s = segs[0];

    data.forEach(function (d, i) {
      if (d.value == null) return;

    });
    const every = o.labelEvery || Math.max(1, Math.ceil(n / 6));
    data.forEach(function (d, i) {

  /* Franjas de sueño sobre eje horario (18:00 → 14:00 del día siguiente). */
  sleep: function (nights) {
    const rows = nights.length;
    if (!rows) return '';
    const rowH = 15, padT = 18, padL = 26, padB = 4;
    const H = padT + rows * rowH + padB;
    const plotW = CH_W - padL - 8;
    const START = 1080, WIN = 1200; // 18:00, ventana de 20 h
    function X(m) { return padL + plotW * clamp((m - START) / WIN, 0, 1); }
    let grid = '', ticks = '';
    for (let h = 18; h <= 38; h += 4) {
      const x = X(h * 60);
      grid += '<line class="grid-line" x1="' + round(x, 1) + '" y1="' + padT + '" x2="' + round(x, 1) + '" y2="' + (H - padB) + '"/>';
      ticks += '<text class="axis-label" x="' + round(x, 1) + '" y="12" text-anchor="middle">' + ((h % 24) + ':00') + '</text>';
    }
    const tips = [];
    let bands = '', labels = '';
    nights.forEach(function (nt, i) {
      const y = padT + i * rowH + 2;
      labels += '<text class="axis-label" x="' + (padL - 5) + '" y="' + round(y + 9, 1) + '" text-anchor="end">' + esc(nt.label) + '</text>';
      if (!nt.sleep) return;
      let bed = nt.sleep.bed;
      if (bed < START) bed += 1440;
      const dur = Domain.sleepMinutes(nt.sleep.bed, nt.sleep.wake);
      const x1 = X(bed), x2 = X(bed + dur);
      const w = Math.max(3, x2 - x1);
      bands += '<rect x="' + round(x1, 1) + '" y="' + round(y, 1) + '" width="' + round(w, 1) +
        '" height="' + (rowH - 4) + '" rx="' + ((rowH - 4) / 2) + '" fill="var(--c-sleep)" fill-opacity="0.85"/>';
      tips.push({
        x: round((x1 + x2) / 2, 1), y: round(y, 1),
        t: nt.label + ' · ' + minutesToClock(nt.sleep.bed) + '–' + minutesToClock(nt.sleep.wake) + ' · ' + minutesToHM(dur)
      });
    });
    return chartHolder('<svg class="chart" viewBox="0 0 ' + CH_W + ' ' + H + '" role="img" aria-label="Franjas de sueño de las últimas noches">' +
      grid + ticks + labels + bands + '</svg>', tips);
  },


  /* Rejilla de cumplimiento tipo calendario de contribuciones. */
  contrib: function (days) {
    let html = '<div class="contrib">';
    if (days.length) {
      // Se rellena hasta que la primera columna empiece en lunes.
      const firstDow = (dateOf(days[0].key).getDay() + 6) % 7;
      for (let i = 0; i < firstDow; i++) html += '<span style="visibility:hidden"></span>';
    }
    days.forEach(function (d) {
      const op = d.count === 0 ? 0 : (0.28 + 0.24 * d.count);
      const bg = d.count === 0 ? 'var(--fill)' : 'color-mix(in srgb, var(--accent) ' + Math.round(op * 100) + '%, transparent)';
      html += '<button type="button" data-contrib="' + d.key + '" style="background:' + bg +
        '" aria-label="' + esc(fmtDateShort(d.key) + ': ' + d.count + ' de ' + d.total + ' objetivos') + '"></button>';
    });
    return html + '</div>';
  }
};


/** Traza una curva suave (Catmull-Rom convertido a Bézier) por los puntos. */
function smoothPath(pts) {
  if (!pts.length) return '';
  if (pts.length === 1) return 'M ' + round(pts[0][0], 1) + ' ' + round(pts[0][1], 1) + ' l 0.01 0';
  let d = 'M ' + round(pts[0][0], 1) + ' ' + round(pts[0][1], 1);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i], p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ' C ' + round(c1x, 1) + ' ' + round(c1y, 1) + ' ' + round(c2x, 1) + ' ' + round(c2y, 1) + ' ' + round(p2[0], 1) + ' ' + round(p2[1], 1);
  }
  return d;
}


/** Activa el punto de lectura de los gráficos dentro de un contenedor. */
function attachCharts(root) {
  $$('.chart-holder', root).forEach(function (holder) {
    let tips = [];
    try { tips = JSON.parse(holder.getAttribute('data-tips') || '[]'); } catch (e) { tips = []; }
    if (!tips.length) return;
    const svg = $('svg', holder);
    const tip = $('.chart-tip', holder);
    const cursor = $('.cursor', svg);
    const vb = (svg.getAttribute('viewBox') || '0 0 320 150').split(' ').map(Number);


    function move(e) {
      const r = holder.getBoundingClientRect();
      if (!r.width) return;
      const vx = (e.clientX - r.left) / r.width * vb[2];
      let best = tips[0], bd = Infinity;
      for (let i = 0; i < tips.length; i++) {
        const d = Math.abs(tips[i].x - vx);
        if (d < bd) { bd = d; best = tips[i]; }
      }
      if (!best) return;
      tip.textContent = best.t;
      tip.style.left = (best.x / vb[2] * 100) + '%';
      tip.style.top = (best.y / vb[3] * 100) + '%';
      tip.classList.add('on');
      if (cursor) {
        cursor.setAttribute('x1', best.x); cursor.setAttribute('x2', best.x);
        cursor.style.display = '';
      }
    }
    function leave() {
      tip.classList.remove('on');
      if (cursor) cursor.style.display = 'none';
    }
    Bus.on(holder, 'pointermove', move);
    Bus.on(holder, 'pointerdown', move);
    Bus.on(holder, 'pointerleave', leave);
    Bus.on(holder, 'pointercancel', leave);
  });
}

/* --- Selector de hora en rueda ------------------------------------------- */
const Wheel = {
  render: function (id, from, to, step, selected, label) {
    let items = '';
    for (let v = from; v <= to; v += step) {
      items += '<div data-v="' + v + '"' + (v === selected ? ' class="sel"' : '') + '>' +
        String(v).padStart(2, '0') + '</div>';
    }
    return '<div class="wheel" id="' + id + '" tabindex="0" role="spinbutton" aria-label="' + esc(label) +
      '" aria-valuemin="' + from + '" aria-valuemax="' + to + '" aria-valuenow="' + selected + '">' + items + '</div>';
  },
  init: function (root) {
    $$('.wheel', root).forEach(function (w) {
      const items = $$('div', w);
      const sel = $('.sel', w);
      function sync() {
        const idx = clamp(Math.round(w.scrollTop / 40), 0, items.length - 1);
        items.forEach(function (it, i) { it.classList.toggle('sel', i === idx); });
        w.setAttribute('aria-valuenow', items[idx] ? items[idx].getAttribute('data-v') : '0');
      }
      if (sel) w.scrollTop = items.indexOf(sel) * 40;
      let t = null;
      w.addEventListener('scroll', function () {
        if (t) clearTimeout(t);
        t = setTimeout(sync, 60);
      });
      w.addEventListener('keydown', function (e) {
        const idx = Math.round(w.scrollTop / 40);
        if (e.key === 'ArrowDown') { e.preventDefault(); w.scrollTop = Math.min(items.length - 1, idx + 1) * 40; setTimeout(sync, 80); }
        if (e.key === 'ArrowUp') { e.preventDefault(); w.scrollTop = Math.max(0, idx - 1) * 40; setTimeout(sync, 80); }
      });
    });
  },
  value: function (root, id) {
    const w = $('#' + id, root || document);
    if (!w) return 0;
    const items = $$('div', w);
    const it = items[clamp(Math.round(w.scrollTop / 40), 0, items.length - 1)];
    return it ? Number(it.getAttribute('data-v')) : 0;
  }
};


function timePicker(idPrefix, minutes, label) {

        const intensity = current(hh, 'data-wint');

        State.update(function () {
          const d = State.ensureDay(key);
          if (existing) {
            const i = d.workouts.findIndex(function (w) { return w.id === existing.id; });
            if (i >= 0) d.workouts[i] = { id: existing.id, type: type, min: Math.round(min), intensity: intensity, kcal: kcal };
            else d.workouts.push({ id: uid('w'), type: type, min: Math.round(min), intensity: intensity, kcal: kcal });

    });
    h.el.addEventListener('input', function (e) { if (e.target.id === 'woMin') refresh(h); });

  /* --- Sueño ------------------------------------------------------------ */
  sleep: function (key) {
    const cur = State.day(key).sleep;
    const bed = cur ? cur.bed : 23 * 60 + 30;
    const wake = cur ? cur.wake : 7 * 60 + 30;
    const QUAL = [
      { v: 1, n: 'Muy malo' }, { v: 2, n: 'Malo' }, { v: 3, n: 'Normal' },
      { v: 4, n: 'Bueno' }, { v: 5, n: 'Excelente' }
    ];
    const body =
      '<div class="block" style="padding-top:0">' +
        '<div class="grid-2" style="align-items:start">' +
          timePicker('slBed', bed, 'Acostarse') +
          timePicker('slWake', wake, 'Levantarse') +
        '</div>' +
        '<div class="card" style="margin-top:8px">' +
          '<div class="kv"><span class="k">Duración</span><span class="v" id="slDur">—</span></div>' +
          '<div class="kv"><span class="k">Eficiencia</span><span class="v" id="slEff">—</span></div>' +
        '</div>' +
        '<label class="label" style="margin-top:16px" for="slAwake">Tiempo despierto durante la noche (min)</label>' +
        '<input class="field" id="slAwake" type="number" inputmode="numeric" min="0" max="480" step="5" value="' +
        (cur && cur.awake ? cur.awake : 0) + '">' +
        '<span class="label" style="margin-top:16px">Calidad del descanso</span>' +
        '<div class="quality-scale" id="slQual" role="radiogroup" aria-label="Calidad del descanso">' +
          QUAL.map(function (q) {
            const on = cur ? cur.quality === q.v : q.v === 3;
            return '<button type="button" role="radio" data-qual="' + q.v + '" aria-checked="' + (on ? 'true' : 'false') + '">' +
              qualityIcon(q.v) + '<span>' + esc(q.n) + '</span></button>';
          }).join('') +
        '</div>' +
        '<p class="field-error" id="slErr" hidden></p>' +
      '</div>';


    const h = Sheet.open({
      title: 'Sueño · noche del ' + fmtDateShort(addDays(key, -1)),
      right: 'Guardar', body: body,
      onMount: function (hh) { Wheel.init(hh.el); setTimeout(function () { refresh(hh); }, 30); },
      onConfirm: function (hh) {
        const b = Wheel.value(hh.el, 'slBed-h') * 60 + Wheel.value(hh.el, 'slBed-m');
        const w = Wheel.value(hh.el, 'slWake-h') * 60 + Wheel.value(hh.el, 'slWake-m');
        const awake = clamp(parseNum($('#slAwake', hh.el).value) || 0, 0, 480);
        const dur = Domain.sleepMinutes(b, w);
        const err = $('#slErr', hh.el);
        if (awake >= dur) {
          err.hidden = false; err.textContent = 'El tiempo despierto no puede igualar ni superar la duración del sueño.';
          return;
        }
        const qb = $('#slQual [aria-checked="true"]', hh.el);
        const quality = qb ? Number(qb.getAttribute('data-qual')) : 3;
        State.update(function () {
          State.ensureDay(key).sleep = { bed: b, wake: w, awake: awake, quality: quality };
        }, ['sleep', 'day']);
        hh.close(true);
        Toast.show('Sueño guardado', 'check');
      }
    });


    function refresh(hh) {
      if (hh.closed) return;
      const b = Wheel.value(hh.el, 'slBed-h') * 60 + Wheel.value(hh.el, 'slBed-m');
      const w = Wheel.value(hh.el, 'slWake-h') * 60 + Wheel.value(hh.el, 'slWake-m');
      const awake = clamp(parseNum($('#slAwake', hh.el).value) || 0, 0, 480);
      $('#slDur', hh.el).textContent = minutesToHM(Domain.sleepMinutes(b, w));
      $('#slEff', hh.el).textContent = Domain.sleepEfficiency(b, w, awake) + ' %';
    }


    h.el.addEventListener('click', function (e) {
      const q = e.target.closest('[data-qual]');
      if (q) { selectOne($$('#slQual button', h.el), q); pulse(q); }
    });
    h.el.addEventListener('input', function (e) { if (e.target.id === 'slAwake') refresh(h); });
    h.el.addEventListener('scroll', function () { refresh(h); }, true);
  }
};


/** Iconografía propia de la escala de calidad del descanso. */
function qualityIcon(v) {
  const bars = [];
  for (let i = 1; i <= 5; i++) {
    bars.push('<rect x="' + (2 + (i - 1) * 4.4) + '" y="' + (18 - i * 2.8) + '" width="3" height="' + (i * 2.8) +
      '" rx="1.4" fill="currentColor" fill-opacity="' + (i <= v ? 1 : 0.22) + '"/>');
  }
  return '<svg width="24" height="20" viewBox="0 0 24 20" aria-hidden="true">' + bars.join('') + '</svg>';
}
/* ==========================================================================
   COMIDA — buscador, hoja de cantidad, alimentos propios y recetas

const FoodFlow = {

    });


    function render() {
      const box = $('#fResults', h.el);

      const st = FoodFlow.state;

        list = State.data.recents.map(function (id) { return FoodIndex.get(id); }).filter(Boolean);

        list = State.data.favorites.map(function (id) { return FoodIndex.get(id); }).filter(Boolean);
      } else {

            ? emptyState('clock', 'Sin recientes', 'Los alimentos que registres aparecerán aquí para repetirlos en un toque.')
            : emptyState('search', 'Sin resultados', 'Prueba con otro término o crea tu propio alimento desde el botón inferior.'));
        return;
      }
      box.innerHTML = '<div class="list">' + list.map(function (f) {

          : nf(f.kcal) + ' kcal / 100 ' + f.base;
        const tag = f.builtinRecipe ? ' <span class="badge accent">receta</span>'

            '<span class="fi-name">' + esc(f.name) + tag + '</span>' +
            '<span class="fi-meta">' + esc(meta) + '</span>' +

          '<span class="fi-kcal">' + nf(f.kcal) + '</span>' +

      if (cat) {
        const id = cat.getAttribute('data-fcat');
        const same = FoodFlow.state.cat === id;
        FoodFlow.state.cat = same ? 'all' : id;
        FoodFlow.state.tab = 'todos';
        $$('#fTabs .chip', h.el).forEach(function (c) { c.setAttribute('aria-pressed', String(!same && c === cat)); });
        if (same) $('[data-ftab="todos"]', h.el).setAttribute('aria-pressed', 'true');
        render(); return;
      }
      const fav = e.target.closest('[data-ffav]');
      if (fav) {
        const id = fav.getAttribute('data-ffav');
        pulse(fav);
        State.update(function (s) {
          const i = s.favorites.indexOf(id);
          if (i >= 0) s.favorites.splice(i, 1); else s.favorites.unshift(id);
        }, ['food']);
        render(); return;
      }
      const pick = e.target.closest('[data-fpick]');
      if (pick) {
        const f = FoodIndex.get(pick.getAttribute('data-fpick'));
        if (f) FoodFlow.quantity(f, key, mealId, null);
        return;
      }
      if (e.target.closest('[data-fnew]')) { FoodFlow.customFood(null, render); return; }
      if (e.target.closest('[data-frecipe]')) FoodFlow.recipe(null, render);
    });
